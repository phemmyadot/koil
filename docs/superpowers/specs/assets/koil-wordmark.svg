<svg width="370" height="120" viewBox="0 0 370 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="koilGradWm" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%" stop-color="#0B3191"/>
      <stop offset="100%" stop-color="#4D9DFF"/>
    </linearGradient>
  </defs>

  <!-- K-mark tile -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="#0A0E17"/>
  <g fill="none" stroke="url(#koilGradWm)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 36 20 L 36 30 L 48 36 L 36 42 L 48 48 L 36 54 L 36 58"/>
    <path d="M 36 58 L 36 98"/>
    <path d="M 36 58 L 92 24"/>
    <path d="M 42 62 L 88 98"/>
  </g>
  <circle cx="92" cy="24" r="6.5" fill="#4D9DFF"/>

  <!-- OIL: geometric sans, condensed + letter-spaced to sit tight against the mark.
       x=128 (was 150) closes the gap after the mark tile ends at x=118 -- a bold sans's own
       left side-bearing already supplies enough visual breathing room, so this reads as one
       tight lockup instead of two separate elements. Baseline at y=86 centers the text's
       cap-height (roughly 64*0.72=46px tall, cap-top ~y=40) against the 120px-tall mark tile
       (visual center ~y=60). -->
  <text x="128" y="86" font-family="Futura, 'Century Gothic', 'Segoe UI', system-ui, sans-serif"
        font-size="64" font-weight="700" letter-spacing="2" fill="#0A0E17">OIL</text>
</svg>
