name: Deploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    # Runs on rog-server itself (self-hosted runner) -- it connects outbound
    # to GitHub, so no inbound port-forwarding/VPN is needed to reach a
    # LAN-only box. No DEPLOY_HOST/USER/SSH_KEY secrets required.
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: bash ~/pine-trend-strategy/deploy.sh

      - name: Kick off background health check
        # app.py's startup no longer blocks on the first fetch+compute pass
        # -- the port opens immediately and a cold cache can legitimately
        # take well past 10 minutes to finish loading ~1600+ tickers from
        # Yahoo. That's normal, not a failure, so the pipeline no longer
        # waits on it at all: the deploy step already succeeding (container
        # built/started/cloudflared restarted) is what "pass" means now.
        # This just launches the checker detached (nohup + disown) and
        # returns immediately -- the job finishes in seconds. Checkpoint
        # results land in backend/health_check.log on rog-server, not in the
        # Actions log, since the runner process is gone by the time later
        # checkpoints fire.
        run: |
          cd ~/pine-trend-strategy
          nohup bash health_check.sh > /dev/null 2>&1 &
          disown
          echo "Health check running in background -- see ~/pine-trend-strategy/backend/health_check.log"
