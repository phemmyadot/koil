name: Deploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    # Runs on rog-server itself (self-hosted runner) -- it connects outbound
    # to GitHub, so no inbound port-forwarding/VPN is needed to reach a
    # LAN-only box. No DEPLOY_HOST/USER/SSH_KEY secrets required.
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: bash ~/pine-trend-strategy/deploy.sh
