}

// ==========================================================================
// P/L Calculator -- Spot (entry/target/stop -> max gain/loss) and Options
// (Black-Scholes: strike/DTE/IV -> theoretical price, delta, theta, and a
// pure time-decay chart holding the underlying price flat at entry). Not
// tied to any ticker's live data -- fully manual entry, standalone.
// ==========================================================================

// Standard normal CDF via Abramowitz & Stegun 7.1.26 erf approximation
// (~1e-7 max error) -- no external math library available client-side.
function normCdf(x) {
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x) / Math.SQRT2;
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1) * t * Math.exp(-x*x);
  return 0.5 * (1 + sign * y);
}
function normPdf(x) {
  return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
}

const RISK_FREE_RATE = 0.045; // fixed assumption, not user-configurable -- minor P&L impact

// Black-Scholes price/delta/theta. T in years, iv/r as decimals (0.30 = 30%).
// theta returned as PER-DAY (annual theta / 365), the conventional quoting.
function blackScholes(type, S, K, T, iv, r) {
  if (T <= 0) {
    const intrinsic = type === "call" ? Math.max(S - K, 0) : Math.max(K - S, 0);
    const delta = type === "call" ? (S > K ? 1 : 0) : (S < K ? -1 : 0);
    return { price: intrinsic, delta, theta: 0 };
  }
  const sqrtT = Math.sqrt(T);
  const d1 = (Math.log(S / K) + (r + 0.5 * iv * iv) * T) / (iv * sqrtT);
  const d2 = d1 - iv * sqrtT;
  const disc = Math.exp(-r * T);
  let price, delta, theta;
  if (type === "call") {
    price = S * normCdf(d1) - K * disc * normCdf(d2);
    delta = normCdf(d1);
    theta = (-(S * normPdf(d1) * iv) / (2 * sqrtT) - r * K * disc * normCdf(d2)) / 365;
  } else {
    price = K * disc * normCdf(-d2) - S * normCdf(-d1);
    delta = normCdf(d1) - 1;
    theta = (-(S * normPdf(d1) * iv) / (2 * sqrtT) + r * K * disc * normCdf(-d2)) / 365;
  }
  return { price, delta, theta };
}

let plMode = "spot";
function setPlMode(mode) {
  plMode = mode;
  renderPlCalcForm();
}

function fmtMoney(n) { return (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2); }
function fmtPct(n) { return (n >= 0 ? "+" : "") + n.toFixed(1) + "%"; }
function plClass(n) { return n > 0 ? "pos" : (n < 0 ? "neg" : ""); }

function spotFormHtml() {
  return `
    <div class="formrow"><label>Entry Price</label><input type="number" id="plEntry" step="0.01" value="100" oninput="updatePlCalc()"></div>
    <div class="formrow"><label>Target Price</label><input type="number" id="plTarget" step="0.01" value="115" oninput="updatePlCalc()"></div>
    <div class="formrow"><label>Stop Price</label><input type="number" id="plStop" step="0.01" value="93" oninput="updatePlCalc()"></div>
    <div class="formrow"><label>Position Size ($, optional)</label><input type="number" id="plSize" step="1" placeholder="e.g. 1000" oninput="updatePlCalc()"></div>
    <div class="resultgrid" id="plResults"></div>`;
}

// ---- Options mode: P/L-vs-underlying-price payoff diagram, ported from a
// reference React component into vanilla JS/SVG (no framework in this app).
// State lives in plain globals (same pattern as plMode) since re-rendering
// the whole form on every drag/slider tick would lose input focus/cursor
// position -- only the chart + stat boxes get rebuilt on change, the input
// elements themselves are built once per mode switch.
let plOptSide = "buy", plOptType = "call";
let plEvalPrice = null; // set to spot on first render / whenever spot changes
let plEvalDays = null; // set to daysElapsed (today's position) on first render / whenever entry date or DTE changes
let plDragging = false;
const PL_CHART_W = 560, PL_CHART_H = 240;
const PL_PAD = { l: 50, r: 14, t: 16, b: 26 };

function toggleGrpHtml(id, options, current, setter) {
  return `<div class="togglegrp" id="${id}">` + options.map(([val, label]) =>
    `<button type="button" class="${val}${val === current ? " active" : ""}" onclick="${setter}('${val}')">${label}</button>`
  ).join("") + `</div>`;
}
function setPlSide(v) { plOptSide = v; document.querySelectorAll("#plSideToggle button").forEach(b => b.classList.toggle("active", b.classList.contains(v))); updatePlCalc(); }
function setPlOptType(v) { plOptType = v; document.querySelectorAll("#plTypeToggle button").forEach(b => b.classList.toggle("active", b.classList.contains(v))); updatePlCalc(); }

function optionsFormHtml() {
  return `
    <div class="optgrid2">
      ${toggleGrpHtml("plSideToggle", [["buy","Buy"],["sell","Sell"]], plOptSide, "setPlSide")}
      ${toggleGrpHtml("plTypeToggle", [["call","Call"],["put","Put"]], plOptType, "setPlOptType")}
    </div>
    <div class="optfields">
      <div class="formrow"><label>Strike</label><input type="number" id="plStrike" step="1" value="105" oninput="updatePlCalc()"></div>
      <div class="formrow"><label>Premium ($/sh)</label><input type="number" id="plPremium" step="0.05" value="3.00" oninput="updatePlCalc()"></div>
      <div class="formrow"><label>Contracts</label><input type="number" id="plContracts" step="1" value="1" oninput="updatePlCalc()"></div>
      <div class="formrow"><label>Current Price</label><input type="number" id="plSpot" step="0.5" value="100" oninput="onPlSpotInput()"></div>
      <div class="formrow"><label>Implied Vol (%)</label><input type="number" id="plIv" step="0.5" value="35" oninput="updatePlCalc()"></div>
      <div class="formrow"><label>Entry Date</label><input type="date" id="plEntryDate" value="${todayIsoDate()}" oninput="onPlEntryFieldsInput()"></div>
      <div class="formrow"><label>Expiration Date</label><input type="date" id="plExpiryDate" value="${addDaysIso(todayIsoDate(), 30)}" oninput="onPlEntryFieldsInput()"></div>
    </div>
    <svg class="payoffchart" id="plPayoffChart" viewBox="0 0 ${PL_CHART_W} ${PL_CHART_H}"></svg>
    <div class="pllegend">
      <span>&mdash; At expiration</span>
      <span style="color:var(--gold)">- - Model (Black-Scholes)</span>
      <span>Drag chart to scrub price</span>
    </div>
    <div class="formrow" style="margin-top:8px">
      <label id="plTimeFwdLabel">Time forward</label>
    </div>
    <input type="range" id="plEvalDaysSlider" min="0" max="30" step="1" value="0" oninput="onPlEvalDaysInput()" style="width:100%">
    <div class="resultgrid" id="plResults"></div>
    <div class="resultgrid" id="plSummary" style="margin-top:6px"></div>
    <p class="plnote">Model curve uses Black-Scholes with constant IV and a 4.5% risk-free rate &mdash; an estimate, not a quote. Educational tool only, not financial advice.</p>`;
}

function renderPlCalcForm() {
  const body = document.getElementById("plFormBody");
  body.innerHTML = plMode === "spot" ? spotFormHtml() : optionsFormHtml();
  document.getElementById("plModeSpot").className = "modebtn" + (plMode === "spot" ? " active" : "");
  document.getElementById("plModeOptions").className = "modebtn" + (plMode === "options" ? " active" : "");
  document.getElementById("plModalBody").classList.toggle("optmode", plMode === "options");
  if (plMode === "options") {
    plEvalPrice = null; plEvalDays = null;
    const svg = document.getElementById("plPayoffChart");
    svg.addEventListener("mousedown", onPlChartDown);
    svg.addEventListener("mousemove", onPlChartMove);
    window.addEventListener("mouseup", onPlChartUp);
    svg.addEventListener("touchstart", onPlChartDown);
    svg.addEventListener("touchmove", onPlChartMove);
    svg.addEventListener("touchend", onPlChartUp);
  }
  updatePlCalc();
}

function resultBox(label, valueHtml) {
  return `<div class="resultbox"><span class="rlbl">${label}</span><span class="rval">${valueHtml}</span></div>`;
}

function updateSpotCalc() {
  const entry = parseFloat(document.getElementById("plEntry").value);
  const target = parseFloat(document.getElementById("plTarget").value);
  const stop = parseFloat(document.getElementById("plStop").value);
  const sizeRaw = document.getElementById("plSize").value;
  const size = sizeRaw === "" ? null : parseFloat(sizeRaw);
  const out = document.getElementById("plResults");
  if ([entry, target, stop].some(v => isNaN(v)) || entry <= 0) { out.innerHTML = ""; return; }

  const gainPct = (target - entry) / entry * 100;
  const lossPct = (stop - entry) / entry * 100; // negative when stop < entry
  const rr = lossPct !== 0 ? Math.abs(gainPct / lossPct) : null;

  let html = resultBox("Max Gain", `<span class="${plClass(gainPct)}">${fmtPct(gainPct)}</span>`)
           + resultBox("Max Loss", `<span class="${plClass(lossPct)}">${fmtPct(lossPct)}</span>`);
  if (size != null && !isNaN(size) && size > 0) {
    html += resultBox("Max Gain ($)", `<span class="${plClass(gainPct)}">${fmtMoney(size * gainPct / 100)}</span>`)
          + resultBox("Max Loss ($)", `<span class="${plClass(lossPct)}">${fmtMoney(size * lossPct / 100)}</span>`);
  }
  if (rr != null) html += resultBox("Risk:Reward", `1 : ${rr.toFixed(2)}`);
  out.innerHTML = html;
}

// ---- Options: shared field reader + P/L math ----
// Days measured in whole calendar days from local midnight, matching the
// <input type=date> value's own day granularity -- avoids off-by-one from
// comparing raw Date objects with differing time-of-day components.
function todayIsoDate() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function daysBetween(isoA, isoB) {
  const a = new Date(isoA + "T00:00:00"), b = new Date(isoB + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function addDaysIso(iso, days) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function readOptFields() {
  const K = parseFloat(document.getElementById("plStrike").value);
  const premium = parseFloat(document.getElementById("plPremium").value);
  const contracts = Math.max(1, Math.round(parseFloat(document.getElementById("plContracts").value) || 1));
  const S = parseFloat(document.getElementById("plSpot").value);
  const iv = Math.max(parseFloat(document.getElementById("plIv").value) || 0, 0.01) / 100;
  const entryDate = document.getElementById("plEntryDate").value || todayIsoDate();
  const expiryDate = document.getElementById("plExpiryDate").value || addDaysIso(entryDate, 30);
  const dte = Math.max(daysBetween(entryDate, expiryDate), 1);
  // daysElapsed = how far "today" sits on the entry->expiry timeline; clamped
  // into [0, dte] so a stale/mistyped entry date can't push it out of range.
  const daysElapsed = Math.min(Math.max(daysBetween(entryDate, todayIsoDate()), 0), dte);
  return { side: plOptSide, type: plOptType, K, premium, contracts, S, iv, entryDate, expiryDate, dte, daysElapsed };
}
function optFieldsValid(f) {
  return ![f.K, f.premium, f.contracts, f.S, f.iv, f.dte].some(v => isNaN(v)) && f.K > 0 && f.S > 0 && f.premium >= 0;
}
function plMult(f) { return f.contracts * 100; }
function plSign(f) { return f.side === "buy" ? 1 : -1; }
function plAtExpiry(f, S) {
  const intrinsic = f.type === "call" ? Math.max(S - f.K, 0) : Math.max(f.K - S, 0);
  return plSign(f) * (intrinsic - f.premium) * plMult(f);
}
// daysFromEntry: position on the entry->expiry timeline (0 = entry date,
// f.dte = expiration) -- NOT days from today. The slider's default sits at
// f.daysElapsed (today's actual position); dragging it explores other points
// on that same timeline, including past expiration-relative-to-entry dates.
function plModelAt(f, S, daysFromEntry) {
  const T = Math.max(f.dte - daysFromEntry, 0) / 365;
  return plSign(f) * (blackScholes(f.type, S, f.K, T, f.iv, RISK_FREE_RATE).price - f.premium) * plMult(f);
}
function plPriceRange(f) {
  const center = (f.K + f.S) / 2;
  const span = Math.max(f.K * 0.22, Math.abs(f.S - f.K) * 2.2, f.premium * 4, 1);
  return [Math.max(0.01, center - span), center + span];
}

function onPlSpotInput() {
  plEvalPrice = parseFloat(document.getElementById("plSpot").value) || plEvalPrice;
  updatePlCalc();
}
function onPlEntryFieldsInput() {
  // Entry date / DTE define the position itself -- changing either resets
  // the slider back to "today" on the new timeline, same as how changing
  // spot resets the price scrub.
  plEvalDays = null;
  updatePlCalc();
}
function onPlEvalDaysInput() {
  plEvalDays = parseInt(document.getElementById("plEvalDaysSlider").value, 10) || 0;
  updatePlCalc();
}

function plPriceFromEvent(e, f) {
  const svg = document.getElementById("plPayoffChart");
  const rect = svg.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const px = ((clientX - rect.left) / rect.width) * PL_CHART_W;
  const [loS, hiS] = plPriceRange(f);
  const iw = PL_CHART_W - PL_PAD.l - PL_PAD.r;
  const S = loS + ((px - PL_PAD.l) / iw) * (hiS - loS);
  return Math.min(hiS, Math.max(loS, S));
}
function onPlChartDown(e) {
  e.preventDefault();
  plDragging = true;
  const f = readOptFields();
  if (optFieldsValid(f)) { plEvalPrice = plPriceFromEvent(e, f); updatePlCalc(); }
}
function onPlChartMove(e) {
  if (!plDragging) return;
  const f = readOptFields();
  if (optFieldsValid(f)) { plEvalPrice = plPriceFromEvent(e, f); updatePlCalc(); }
}
function onPlChartUp() { plDragging = false; }

function buildPayoffChart(f) {
  const svg = document.getElementById("plPayoffChart");
  const [loS, hiS] = plPriceRange(f);
  const iw = PL_CHART_W - PL_PAD.l - PL_PAD.r, ih = PL_CHART_H - PL_PAD.t - PL_PAD.b;
  const N = 100;
  const expPts = [], modelPts = [];
  let yMin = Infinity, yMax = -Infinity;
  for (let i = 0; i <= N; i++) {
    const S = loS + ((hiS - loS) * i) / N;
    const a = plAtExpiry(f, S), b = plModelAt(f, S, plEvalDays);
    expPts.push([S, a]); modelPts.push([S, b]);
    yMin = Math.min(yMin, a, b); yMax = Math.max(yMax, a, b);
  }
  const pad = Math.max((yMax - yMin) * 0.12, 20);
  yMin -= pad; yMax += pad;
  const xOf = S => PL_PAD.l + ((S - loS) / (hiS - loS)) * iw;
  const yOf = v => PL_PAD.t + (1 - (v - yMin) / (yMax - yMin || 1)) * ih;
  const pathOf = pts => pts.map(([S, v], i) => `${i ? "L" : "M"}${xOf(S).toFixed(1)},${yOf(v).toFixed(1)}`).join(" ");
  const zeroY = Math.min(Math.max(yOf(0), PL_PAD.t), PL_PAD.t + ih);

  const breakeven = f.type === "call" ? f.K + f.premium : f.K - f.premium;
  const evalPrice = plEvalPrice == null ? f.S : plEvalPrice;
  const evalX = xOf(Math.min(hiS, Math.max(loS, evalPrice)));
  const evalPL = plModelAt(f, evalPrice, plEvalDays);
  const evalY = Math.min(Math.max(yOf(evalPL), PL_PAD.t), PL_PAD.t + ih);
  const profit = evalPL >= 0;

  const yTicks = [];
  { const range = yMax - yMin, raw = range / 5 || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => range / s <= 6) || raw;
    for (let v = Math.ceil(yMin / step) * step; v <= yMax; v += step) yTicks.push(v); }
  const xTicks = [];
  for (let i = 1; i < 6; i++) xTicks.push(loS + (hiS - loS) * i / 6);

  const gridHtml = yTicks.map(v => `
    <line x1="${PL_PAD.l}" x2="${PL_PAD.l + iw}" y1="${yOf(v).toFixed(1)}" y2="${yOf(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <text class="axislabel" x="${PL_PAD.l - 6}" y="${(yOf(v) + 3).toFixed(1)}" text-anchor="end">${v < 0 ? "-" : ""}$${Math.round(Math.abs(v))}</text>`
  ).join("") + xTicks.map(S => `
    <text class="axislabel" x="${xOf(S).toFixed(1)}" y="${PL_CHART_H - 8}" text-anchor="middle">$${S.toFixed(0)}</text>`
  ).join("");

  const breakevenHtml = (breakeven > loS && breakeven < hiS) ? `
    <circle cx="${xOf(breakeven).toFixed(1)}" cy="${zeroY.toFixed(1)}" r="3.5" fill="var(--panel)" stroke="var(--gold)" stroke-width="2"/>
    <text class="marklabel" x="${xOf(breakeven).toFixed(1)}" y="${(zeroY - 8).toFixed(1)}" text-anchor="middle" fill="var(--gold)">BE $${breakeven.toFixed(2)}</text>` : "";

  svg.innerHTML = `
    ${gridHtml}
    <line x1="${PL_PAD.l}" x2="${PL_PAD.l + iw}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" stroke="var(--muted)" stroke-width="1.2" opacity="0.7"/>
    <path d="${pathOf(expPts)}" fill="none" stroke="var(--text)" stroke-width="2" opacity="0.9"/>
    <path d="${pathOf(modelPts)}" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5,4" opacity="0.95"/>
    <line x1="${xOf(f.K).toFixed(1)}" x2="${xOf(f.K).toFixed(1)}" y1="${PL_PAD.t}" y2="${PL_PAD.t + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,4"/>
    <text class="marklabel" x="${(xOf(f.K) + 4).toFixed(1)}" y="${PL_PAD.t + 11}">K $${f.K}</text>
    ${breakevenHtml}
    <line x1="${evalX.toFixed(1)}" x2="${evalX.toFixed(1)}" y1="${PL_PAD.t}" y2="${PL_PAD.t + ih}" stroke="${profit ? "var(--green)" : "var(--red)"}" stroke-width="1" opacity="0.5"/>
    <circle cx="${evalX.toFixed(1)}" cy="${evalY.toFixed(1)}" r="5" fill="${profit ? "var(--green)" : "var(--red)"}" stroke="var(--panel)" stroke-width="2"/>`;
}

function updateOptionsCalc() {
  const f = readOptFields();
  const out = document.getElementById("plResults");
  const summary = document.getElementById("plSummary");
  if (!optFieldsValid(f)) {
    out.innerHTML = ""; summary.innerHTML = ""; document.getElementById("plPayoffChart").innerHTML = "";
    return;
  }
  if (plEvalPrice == null) plEvalPrice = f.S;
  // Default (and reset-on-entry-field-change target): "today" on the
  // entry->expiry timeline, not day 0 -- the slider represents days since
  // entry, so today is wherever daysElapsed actually lands.
  if (plEvalDays == null) plEvalDays = f.daysElapsed;

  const slider = document.getElementById("plEvalDaysSlider");
  slider.max = f.dte;
  plEvalDays = Math.min(Math.max(plEvalDays, 0), f.dte);
  slider.value = plEvalDays;
  document.getElementById("plTimeFwdLabel").textContent =
    `Time forward: Day ${plEvalDays} of ${f.dte} (today = Day ${f.daysElapsed}, expires ${f.expiryDate})`;

  const evalPL = plModelAt(f, plEvalPrice, plEvalDays);
  const evalPLExp = plAtExpiry(f, plEvalPrice);
  const cost = f.premium * plMult(f);
  const evalRet = cost > 0 ? (evalPL / cost) * 100 : 0;

  out.innerHTML = resultBox(`Stock at ${plEvalDays === 0 ? "today" : "+" + plEvalDays + "d"}`, fmtMoney(plEvalPrice))
                 + resultBox("P/L (model)", `<span class="${plClass(evalPL)}">${fmtMoney(evalPL)}</span>`)
                 + resultBox("P/L at expiry", `<span class="${plClass(evalPLExp)}">${fmtMoney(evalPLExp)}</span>`)
                 + resultBox("Return", `<span class="${plClass(evalRet)}">${fmtPct(evalRet)}</span>`);

  const maxLossLong = cost;
  const maxProfitPut = (f.K - f.premium) * plMult(f);
  const maxProfit = f.side === "buy"
    ? (f.type === "call" ? "Unlimited" : fmtMoney(maxProfitPut))
    : fmtMoney(maxLossLong);
  const maxLoss = f.side === "buy"
    ? fmtMoney(-maxLossLong)
    : (f.type === "call" ? "Unlimited" : fmtMoney(-maxProfitPut));
  const breakeven = f.type === "call" ? f.K + f.premium : f.K - f.premium;
  summary.innerHTML = resultBox(f.side === "buy" ? "Cost (max risk)" : "Credit received", fmtMoney(cost))
                     + resultBox("Breakeven", fmtMoney(breakeven))
                     + resultBox("Max Profit", `<span class="pos">${maxProfit}</span>`)
                     + resultBox("Max Loss", `<span class="neg">${maxLoss}</span>`);

  buildPayoffChart(f);
}

function updatePlCalc() {
  if (plMode === "spot") updateSpotCalc(); else updateOptionsCalc();
}

function showPlCalculator() {
  document.getElementById("modalBox").innerHTML = `
    <div class="modaltitle">P/L Calculator</div>
    <div class="modalbody plcalc" id="plModalBody">
      <div class="modemid">
        <button type="button" class="modebtn" id="plModeSpot" onclick="setPlMode('spot')">Spot</button>
        <button type="button" class="modebtn" id="plModeOptions" onclick="setPlMode('options')">Options</button>
      </div>
      <div id="plFormBody"></div>
    </div>`;
  document.getElementById("modalBackdrop").style.display = "flex";
  plMode = "spot";
  plOptSide = "buy"; plOptType = "call"; plEvalPrice = null; plEvalDays = null;
  renderPlCalcForm();
}

// Color coding: blue = an active/open trade right now, otherwise green/yellow/red
// by how good the historical result actually is (independent of live status).
// qualityLabel is the single source of truth for the good/fair/bad thresholds --
// both the chip color (via QUALITY_CSS) and the strategy score filter read it.
function qualityLabel(pf, wr) {
  if (pf >= 2.0 && wr >= 45) return "good";
  if (pf >= 1.0) return "fair";
  return "bad";
}
const QUALITY_CSS = { good: "ok", fair: "mid", bad: "no" };

const QUALITY_RANK = { bad: 0, fair: 1, good: 2 };

// ---------------- Advance Filter ----------------
// Flat: one Strategy radio (which strategy's stats to read) + Win Rate AND
// Profit minimum-threshold sliders. Base/Training/Holdout sub-views are
// gone -- always reads baseline stats. See FILTER_ARCHITECTURE.md.
const ADV_STRATEGIES = [["adx", "ADX"], ["vcpf", "VCPF"], ["vcp", "VCP"], ["vcpo", "VCPO"], ["vexh", "VEXH"]]
  .filter(([key]) => SHOW_ADX_VCPF || (key !== "adx" && key !== "vcpf"));
const ADV_STRAT_KEY = { adx: "strategy_a", vcpf: "strategy_d", vcp: "strategy_vcp", vcpo: "strategy_vcpo" };
const WR_STEPS = [0, 50, 70, 75];
const PF_STEPS = [0, 1, 1.5, 2, 2.5, 3.5, 5.0];

function sliderStepsHtml(steps, suffix) {
  return steps.map(v => `<span>${v}${suffix}</span>`).join("");
}
function buildAdvFilterPanel() {
  const stratRadios = ADV_STRATEGIES.map(([key, label], i) =>
    `<label class="advcheck"><input type="radio" name="advStrategy" data-strat="${key}" ${i === 0 ? "checked" : ""}> ${label}</label>`
  ).join("");
  return `<div class="advsectionlabel">Strategy</div>
    <div class="advradiorow">${stratRadios}</div>
    <div class="advsliderrow">
      <div class="advslider">
        <div class="advsectionlabel">Win Rate</div>
        <input type="range" id="advWrSlider" min="0" max="${WR_STEPS.length - 1}" step="1" value="0">
        <div class="advslidersteps">${sliderStepsHtml(WR_STEPS, "%")}</div>
      </div>
      <span class="advand">AND</span>
      <div class="advslider">
        <div class="advsectionlabel">Profit</div>
        <input type="range" id="advPfSlider" min="0" max="${PF_STEPS.length - 1}" step="1" value="0">
        <div class="advslidersteps">${sliderStepsHtml(PF_STEPS, "")}</div>
      </div>
    </div>
    <div class="advfilterfoot"><button id="advFilterClearBtn" class="clearfilters" type="button">Clear</button></div>`;
}

// Baseline WR/PF for one strategy -- null if that strategy has no data for
// this ticker, which makes the filter fail to match (see matchesAdvFilter).
function advStrategyStats(r, strat) {
  if (strat === "vexh") return { wr: r.win_rate, pf: r.profit_factor };
  const s = r[ADV_STRAT_KEY[strat]];
  if (!s || !s.baseline) return null;
  return { wr: s.baseline.win_rate, pf: s.baseline.profit_factor };
}
function readAdvFilter() {
  const stratEl = document.querySelector('#advFilterPanel input[name="advStrategy"]:checked');
  const wrEl = document.getElementById("advWrSlider");
  const pfEl = document.getElementById("advPfSlider");
  return {
    strategy: stratEl ? stratEl.dataset.strat : ADV_STRATEGIES[0][0],
    wrMin: WR_STEPS[wrEl ? Number(wrEl.value) : 0],
    pfMin: PF_STEPS[pfEl ? Number(pfEl.value) : 0],
  };
}
function matchesAdvFilter(r, adv) {
  // True no-op at default (both sliders at index 0) -- don't exclude a
  // ticker just for lacking data for whichever strategy happens to be
  // selected if nothing is actually being filtered on yet.
  if (adv.wrMin <= WR_STEPS[0] && adv.pfMin <= PF_STEPS[0]) return true;
  const stats = advStrategyStats(r, adv.strategy);
  if (!stats) return false;
  return stats.wr >= adv.wrMin && stats.pf >= adv.pfMin;
}

// ---------------- Trade On filter ----------------
// Separate from Advance Filter, ANDed against it (just another .filter() in
// the same chain) -- "is this ticker currently in an open trade on ANY of
// the checked strategies" (OR among the checked strategies themselves).
const TRADE_ON_STRATS = [["adx", "ADX"], ["vcp", "VCP"], ["vcpo", "VCPO"], ["vcpf", "VCPF"], ["vexh", "VEXH"]]
  .filter(([key]) => SHOW_ADX_VCPF || (key !== "adx" && key !== "vcpf"));

function buildTradeOnPanel() {
  const boxes = TRADE_ON_STRATS.map(([key, label]) =>
    `<label class="advcheck"><input type="checkbox" data-strat="${key}"> ${label}</label>`
  ).join("");
  return `<div class="advmetric">${boxes}</div>`
    + `<div class="advfilterfoot"><button id="tradeOnClearBtn" class="clearfilters" type="button">Clear</button></div>`;
}
function isStrategyActive(r, key) {
  if (key === "vexh") return !!r.open_trade;
  const s = r[ADV_STRAT_KEY[key]];
  if (!s || !s.baseline) return false;
  return strategyCandidates(s).some(c => c.active);
}
function readTradeOnStrats() {
  return [...document.querySelectorAll("#tradeOnPanel input[type=checkbox]:checked")].map(cb => cb.dataset.strat);
}
function matchesTradeOnFilter(r, strats) {
  return strats.length === 0 || strats.some(key => isStrategyActive(r, key));
}

// ---------------- Pre-Breakout filter ----------------
// Separate from Advance Filter and Trade On, ANDed against both. Phase and
// Coil Energy are minimum-threshold sliders; the 4 boolean metrics are
// switches (off = no filter, on = require true). All 6 AND together. See
// FILTER_ARCHITECTURE.md -- Phase's default (NEUTRAL) is a real floor, not
// a true no-op: BEARISH tickers are hidden even with nothing else touched.
const PHASE_STEPS = [
  ["BEARISH", -2], ["NEUTRAL", 0], ["BULLISH", 1],
  ["COILING (BULL)", 2], ["PRE-BREAKOUT", 4], ["BREAKOUT", 5],
];
const PHASE_DEFAULT_INDEX = 1; // NEUTRAL
const COIL_STEPS = [0, 5, 8, 12, 15];
const PREBREAK_SWITCHES = [
  ["squeeze", "Volatility Squeeze", "bb_squeeze"],
  ["volume", "Volume Dry-up", "vol_dry_up"],
  ["resistance", "Clustering At Ceiling", "near_resistance"],
  ["trend", "Trend Filter", "is_bullish_trend"],
];

function buildPrebreakPanel() {
  const phaseLabels = sliderStepsHtml(PHASE_STEPS.map(([name]) => name), "");
  const coilLabels = COIL_STEPS.map((v, i) => `<span>${i === 0 ? "0(off)" : v + "+"}</span>`).join("");
  const switches = PREBREAK_SWITCHES.map(([key, label]) =>
    `<label class="switchrow">${label}<span class="switch"><input type="checkbox" data-switch="${key}"><span class="switchtrack"></span></span></label>`
  ).join("");
  return `<div class="advsectionlabel">Phase</div>
    <input type="range" id="prebreakPhaseSlider" min="0" max="${PHASE_STEPS.length - 1}" step="1" value="${PHASE_DEFAULT_INDEX}">
    <div class="advslidersteps">${phaseLabels}</div>
    <div class="switchgrid">${switches}</div>
    <div class="advsectionlabel">Coil Energy Build-up</div>
    <input type="range" id="prebreakCoilSlider" min="0" max="${COIL_STEPS.length - 1}" step="1" value="0">
    <div class="advslidersteps">${coilLabels}</div>
    <div class="advfilterfoot"><button id="prebreakClearBtn" class="clearfilters" type="button">Clear</button></div>`;
}
function readPrebreakFilter() {
  const phaseEl = document.getElementById("prebreakPhaseSlider");
  const coilEl = document.getElementById("prebreakCoilSlider");
  const switches = {};
  for (const [key] of PREBREAK_SWITCHES) {
    const cb = document.querySelector(`#prebreakPanel input[data-switch="${key}"]`);
    switches[key] = !!(cb && cb.checked);
  }
  return {
    phaseMin: PHASE_STEPS[phaseEl ? Number(phaseEl.value) : PHASE_DEFAULT_INDEX][1],
    coilMin: COIL_STEPS[coilEl ? Number(coilEl.value) : 0],
    switches,
  };
}
function matchesPrebreakFilter(r, sel) {
  const pb = r.prebreak;
  // Fail OPEN on missing data (backend couldn't evaluate -- insufficient
  // history, transient error, etc.) rather than hard-excluding the ticker.
  // Consistent with how the rest of the app treats missing per-ticker data
  // (e.g. isStrategyActive returns false gracefully instead of penalizing).
  if (!pb) return true;
  if (pb.score < sel.phaseMin) return false;
  if (pb.squeeze_counter < sel.coilMin) return false;
  for (const [key, , field] of PREBREAK_SWITCHES) {
    if (sel.switches[key] && !pb[field]) return false;
  }
  return true;
}

// n_trades for one strategy view -- VEXH's is a top-level field; A/D/VCP/VCPO
// use whichever candidate strategyChips would surface (BASE, since
// training/holdout is flagged off and strategyCandidates() only ever
// returns BASE), same "best candidate" concept used for O/T/WR/PF badges.
function strategyNTrades(r, key) {
  if (key === "vexh") return r.n_trades;
  const s = r[ADV_STRAT_KEY[key]];
  if (!s || !s.baseline) return null;
  return pickBestCandidate(strategyCandidates(s)).n_trades;
}
// Min Trades only makes sense scoped to whichever strategy you're actually
// looking at via Trade On / Advance Filter -- otherwise it's dominated by
// whichever strategy happens to trade most often (VCP fires far more than
// VEXH's strict 6-gate setup, so an unscoped "any" filter never reflects
// VEXH's count at all). Falls back to all three only when neither Trade On
// nor Advance Filter narrows to specific strategies. Advance Filter's
// Strategy radio only counts as "narrowing" once a slider has actually
// moved off its true no-op default (0), not just because a radio is always
// selected.
function activeMinTradesStrats(tradeOnStrats, adv) {
  const strats = new Set(tradeOnStrats);
  if (adv.wrMin > WR_STEPS[0] || adv.pfMin > PF_STEPS[0]) strats.add(adv.strategy);
  return strats.size ? [...strats] : ["vexh", "vcp", "vcpo"];
}
function matchesMinTrades(r, minTrades, strats) {
  if (minTrades <= 0) return true;
  return strats.some(key => (strategyNTrades(r, key) ?? -1) >= minTrades);
}

// WR/PF get their own independent color grading (not the combined
// good/fair/bad quality tier) -- O is blue while active else neutral gray,
// T is always neutral (just a count, not a quality signal).
function wrColorClass(wr) {
  if (wr >= 70) return "ok";
  if (wr >= 50) return "mid";
  return "no";
}
function pfColorClass(pf) {
  if (pf >= 2.0) return "ok";
  if (pf >= 1.0) return "mid";
  return "no";
}
// 4 separate small badges (O/T/WR/PF) instead of one combined chip, each
// with its own color grading. All 4 open the same modal.
function statBadges(active, days, nTrades, wr, pf, modalId) {
  // Win count derived from the rounded win_rate% and n_trades (backend only
  // stores the percentage, not the raw win count) -- rounding error here is
  // at most the last decimal of wr%, negligible for display purposes.
  const wins = Math.round(wr / 100 * nTrades);
  const badges = [];
  if (active) badges.push(["active", `O-${days}`]);
  badges.push(["neutral", `T${nTrades}`]);
  badges.push([wrColorClass(wr), `WR${wr}%(${wins}/${nTrades})`]);
  badges.push([pfColorClass(pf), `PF${pf}`]);
  return `<span class="badgerow">` + badges.map(([cls, text]) =>
    `<span class="chip ${cls} hasdetail" onclick="showModal('${modalId}')">${text}</span>`
  ).join("") + `</span>`;
}

function optimizedBeatsBaseline(o, baseline) {
  if (!o || !baseline) return false;
  // Robust = worst-of-both-splits, same discipline used to pick the config in
  // the first place -- only worth showing if it actually beats baseline.
  const robustPf = Math.min(o.train_stats.profit_factor, o.holdout_stats.profit_factor);
  const robustWr = Math.min(o.train_stats.win_rate, o.holdout_stats.win_rate);
  return robustPf > baseline.profit_factor || robustWr > baseline.win_rate;
}

// Exhaustion's row: 4 O/T/WR/PF badges (see statBadges) -- entry date/price,
// target, unrealized %, bars held, advice reasoning, and the strategy's own To TP %/
// Avg Days/Last 5 TP % stats all move to the detail modal (click the chip).
function exhaustionChip(r) {
  const t = r.open_trade;
  const rows = [
    modalRow("Trades", r.n_trades),
    modalRow("Profit factor", r.profit_factor),
    modalRow("Win rate", r.win_rate + "%"),
  ];
  if (t) {
    const sign = t.unrealized_pct >= 0 ? "+" : "";
    rows.push('<div class="modalsep"></div>');
    rows.push(modalRow("Entry", `${t.entry_date} @ ${t.entry_price}`));
    rows.push(modalRow("Target", t.target));
    rows.push(modalRow("Unrealized", `${sign}${t.unrealized_pct}%`));
    rows.push(modalRow("Bars held", t.bars_held));
    if (t.entry_confidence) rows.push(modalRow("Entry confidence", t.entry_confidence));
  }
  rows.push('<div class="modalsep"></div>');
  rows.push(modalRow("To TP %", `${r.to_tp_pct > 0 ? "+" : ""}${r.to_tp_pct.toFixed(1)}%`));
  rows.push(modalRow("Avg Days", r.avg_trade_days ?? "&mdash;"));
  rows.push('<div class="modalsep"></div>');
  rows.push(modalRow("Last 5 TP %", last5(r.last5_trades)));
  if (t) {
    rows.push('<div class="modalsep"></div>');
    rows.push(`<div class="modalnote"><b>${t.advice}</b>: ${t.advice_reason}</div>`);
  }
  const id = registerModal("Exhaustion", rows);
  return statBadges(!!t, t ? t.bars_held : null, r.n_trades, r.win_rate, r.profit_factor, id);
}

// Rows shared by the Training and Holdout modals -- same shape, different
// stats/label passed in.
// Build one candidate view per available source (BASE always; TRAIN/HOLD only
// when the optimizer found a config that actually beats baseline).
function strategyCandidates(s) {
  const b = s.baseline;
  const candidates = [{
    source: "BASE", pf: b.profit_factor, wr: b.win_rate, n_trades: b.n_trades,
    active: b.in_position, openPosition: b.open_position, config: s.baseline_config,
    firstTradeDate: b.first_trade_date, verdict: b.verdict, verdictReason: b.verdict_reason,
    avgTradeDays: b.avg_trade_days, last5Trades: b.last5_trades,
    avgMaeWinsPct: b.avg_mae_wins_pct, pctNearZeroMae: b.pct_near_zero_mae,
  }];
  if (optimizedBeatsBaseline(s.optimized, b)) {
    const o = s.optimized;
    // TRAIN/HOLD share one live backtest run of the optimized config, so they
    // share the same open-position state (see strategy_*.py's optimize()).
    const oActive = !!o.open_position;
    candidates.push({ source: "TRAIN", pf: o.train_stats.profit_factor, wr: o.train_stats.win_rate,
      n_trades: o.train_stats.n_trades, active: oActive, openPosition: o.open_position, config: o.config,
      avgTradeDays: o.train_stats.avg_trade_days, last5Trades: o.train_stats.last5_trades,
      firstTradeDate: o.train_stats.first_trade_date });
    candidates.push({ source: "HOLD", pf: o.holdout_stats.profit_factor, wr: o.holdout_stats.win_rate,
      n_trades: o.holdout_stats.n_trades, active: oActive, openPosition: o.open_position, config: o.config,
      avgTradeDays: o.holdout_stats.avg_trade_days, last5Trades: o.holdout_stats.last5_trades,
      firstTradeDate: o.holdout_stats.first_trade_date });
  }
  return candidates;
}

// Pick the single chip to surface: prefer an active (in-trade) candidate --
// best quality among actives if more than one -- otherwise the best-quality
// candidate among all available views.
function pickBestCandidate(candidates) {
  const rank = c => QUALITY_RANK[qualityLabel(c.pf, c.wr)];
  const actives = candidates.filter(c => c.active);
  const pool = actives.length ? actives : candidates;
  return pool.slice().sort((a, b) => rank(b) - rank(a) || b.pf - a.pf)[0];
}

// Longest days-held across ALL open positions on this ticker -- Exhaustion's
// own open_trade plus any active BASE/TRAIN/HOLD candidate on strategy A/D/VCP/VCPO
// (a ticker can be "in trade" on more than one strategy at once). null if
// nothing is open anywhere, so it can sort after tickers that do have one.
function maxDaysInTrade(r) {
  let max = r.open_trade ? r.open_trade.bars_held : null;
  for (const s of [r.strategy_a, r.strategy_d, r.strategy_vcp, r.strategy_vcpo]) {
    if (!s || !s.baseline) continue;
    for (const c of strategyCandidates(s)) {
      if (c.active && c.openPosition && c.openPosition.days_held != null) {
        max = max === null ? c.openPosition.days_held : Math.max(max, c.openPosition.days_held);
      }
    }
  }
  return max;
}

// One combined modal per strategy, laid out in columns (BASE / TRAIN / HOLD
// side by side) so all views are comparable at a glance instead of needing a
// separate modal per chip.
function strategyColumnsModal(name, candidates) {
  const cols = candidates.map(c => {
    const cls = c.active ? "active" : QUALITY_CSS[qualityLabel(c.pf, c.wr)];
    // Same field set/order/grouping as the Exhaustion modal: Trades/Profit
    // factor/Win rate, then [divider] Entry/Target/Unrealized/Bars held (only
    // if open), then [divider] Avg Days, then [divider] Last 5 TP %, then
    // [divider] verdict note. NOTE: "Entry confidence" and "To TP %" are
    // Exhaustion-specific (its validated SMA-distance tier and Bollinger-
    // midline target both need a reference line that exists on every bar,
    // not just while a trade is open) -- A/D/VCP have no equivalent, so
    // those two rows are intentionally omitted here rather than faked.
    const rows = [];
    if (c.config) rows.push(`<div class="modalcolrow"><span class="k">Cfg</span><span>${Object.values(c.config).join(", ")}</span></div>`);
    rows.push(`<div class="modalcolrow"><span class="k">Trades</span><span>${c.n_trades}</span></div>`);
    rows.push(`<div class="modalcolrow"><span class="k">Profit factor</span><span>${c.pf}</span></div>`);
    rows.push(`<div class="modalcolrow"><span class="k">Win rate</span><span>${c.wr}%</span></div>`);
    if (c.firstTradeDate) rows.push(`<div class="modalcolrow"><span class="k">Since</span><span>${c.firstTradeDate}</span></div>`);

    if (c.openPosition) {
      const op = c.openPosition;
      const uCls = op.unrealized_pct >= 0 ? "pos" : "neg";
      const uSign = op.unrealized_pct >= 0 ? "+" : "";
      rows.push('<div class="modalsep"></div>');
      rows.push(`<div class="modalcolrow"><span class="k">Entry</span><span>${op.entry_price}</span></div>`);
      rows.push(`<div class="modalcolrow"><span class="k">Target</span><span>${op.target}</span></div>`);
      if (op.unrealized_pct != null) rows.push(`<div class="modalcolrow"><span class="k">Unrealized</span><span class="${uCls}">${uSign}${op.unrealized_pct}%</span></div>`);
      rows.push(`<div class="modalcolrow"><span class="k">Bars held</span><span>${op.days_held}</span></div>`);
    }

    if (c.avgTradeDays != null) {
      rows.push('<div class="modalsep"></div>');
      rows.push(`<div class="modalcolrow"><span class="k">Avg Days</span><span>${c.avgTradeDays}</span></div>`);
    }

    if (c.last5Trades && c.last5Trades.length) {
      rows.push('<div class="modalsep"></div>');
      rows.push(`<div class="modalcolrow"><span class="k">Last 5 TP %</span><span>${last5(c.last5Trades)}</span></div>`);
    }

    if (c.verdict) {
      rows.push('<div class="modalsep"></div>');
      rows.push(`<div class="modalnote"><b>${c.verdict}</b>: ${c.verdictReason || ""}</div>`);
    }
    return `<div class="modalcol"><div class="modalcolhead chip ${cls}">${c.source}</div>${rows.join("")}</div>`;
  }).join("");
  return registerModal(name, [`<div class="modalcolgrid">${cols}</div>`]);
}

// Flat single-column modal, same row structure/order as exhaustionChip's
// "Exhaustion" modal -- used whenever there's only one candidate (always the
// case for A/D/VCP/VCPO now that training/holdout is flagged off, since
// strategyCandidates() then only ever returns BASE). No Cfg/Since rows
// (VEXH's modal doesn't have them either); "To TP %" and "Entry confidence"
// stay omitted since they're Exhaustion-specific fields with no VCP/VCPO
// equivalent (see strategyColumnsModal's comment for why).
function singleCandidateModal(name, c) {
  const rows = [
    modalRow("Trades", c.n_trades),
    modalRow("Profit factor", c.pf),
    modalRow("Win rate", c.wr + "%"),
  ];
  if (c.openPosition) {
    const op = c.openPosition;
    const sign = op.unrealized_pct >= 0 ? "+" : "";
    rows.push('<div class="modalsep"></div>');
    rows.push(modalRow("Entry", op.entry_price));
    rows.push(modalRow("Target", op.target));
    if (op.unrealized_pct != null) rows.push(modalRow("Unrealized", `${sign}${op.unrealized_pct}%`));
    rows.push(modalRow("Bars held", op.days_held));
  }
  if (c.avgMaeWinsPct != null) {
    // The single number that actually drives a limit-order decision: how
    // far winning trades typically dip below entry before working out.
    // With an open position, converts straight to a price and sits right
    // below Entry (no divider) so the two are visually adjacent; without an
    // open position there's no entry price to anchor to, so it gets its own
    // separator instead of dangling off the top Trades/PF/Win rate block.
    const limitHint = c.openPosition
      ? ` [&rarr; limit at $${(c.openPosition.entry_price * (1 - c.avgMaeWinsPct / 100)).toFixed(2)}]`
      : "";
    if (!c.openPosition) rows.push('<div class="modalsep"></div>');
    rows.push(modalRow("Avg MAE (wins)", `-${c.avgMaeWinsPct}%${limitHint}`));
    if (c.pctNearZeroMae != null) {
      rows.push(modalRow("Wins w/ MAE&lt;1%", c.pctNearZeroMae + "%"));
    }
  }
  rows.push('<div class="modalsep"></div>');
  rows.push(modalRow("Avg Days", c.avgTradeDays ?? "&mdash;"));
  rows.push('<div class="modalsep"></div>');
  rows.push(modalRow("Last 5 TP %", last5(c.last5Trades)));
  if (c.verdict) {
    rows.push('<div class="modalsep"></div>');
    rows.push(`<div class="modalnote"><b>${c.verdict}</b>: ${c.verdictReason || ""}</div>`);
  }
  return registerModal(name, rows);
}

// A/D/VCP row: whichever of BASE/TRAIN/HOLD is active (or best-quality if
// none are) drives 4 separate O/T/WR/PF badges (see statBadges). Which
// source it actually is (BASE/TRAIN/HOLD) is only shown in the modal.
function strategyChips(s, name) {
  if (!s || !s.baseline) return '<span class="chip neutral">&mdash;</span>';
  const candidates = strategyCandidates(s);
  const best = pickBestCandidate(candidates);
  const id = candidates.length === 1
    ? singleCandidateModal(name, candidates[0])
    : strategyColumnsModal(name, candidates);
  const days = best.active && best.openPosition ? best.openPosition.days_held : null;
  return statBadges(best.active, days, best.n_trades, best.wr, best.pf, id);
}
const PAGE_SIZE = 9;
let lastData = null;
let currentPage = 1;

// Watchlist selection: an in-memory (not persisted -- only saved watchlists
// themselves persist) set of tickers checked across however many pages/
// filter changes the user has clicked through, plus whatever the current
// filter matched last render (for "Select all (filtered)").
let selectedTickers = new Set();
let lastFilteredRows = [];
const WATCHLIST_NAMES = ["VCP List", "VEXH List", "VCPO List"];

function loadWatchlists() {
  try {
    return JSON.parse(localStorage.getItem("watchlists")) || {};
  } catch {
    return {};
  }
}
function saveWatchlists(lists) {
  localStorage.setItem("watchlists", JSON.stringify(lists));
}
function addSelectedToWatchlist(name) {
  const lists = loadWatchlists();
  const existing = new Set(lists[name] || []);
  for (const tk of selectedTickers) existing.add(tk);
  lists[name] = [...existing].sort();
  saveWatchlists(lists);
}
function updateSelectionCount() {
  const has = selectedTickers.size > 0;
  document.getElementById("selectionCount").textContent = has ? `${selectedTickers.size} selected` : "";
  document.getElementById("clearSelectionBtn").style.display = has ? "" : "none";
  document.getElementById("addToWatchlistBtn").style.display = has ? "" : "none";
  document.getElementById("refresh").style.display = has ? "none" : "";
}

// The server now precomputes every ticker in the background (see
// webapp/data.py + app.py's compute_all()) and this endpoint just returns
// the full in-memory result set -- so sort/filter/paginate happen here,
// client-side, across the WHOLE universe, same as before backend pagination
// existed, except the "fetch everything" step never happens on this path.
function render(data) {
  lastData = data;
  // Every re-render rebuilds all chips from scratch, so their modal ids
  // would otherwise accumulate forever -- start clean each time.
  modalStore = {};
  modalCounter = 0;
  const minTrades = Number(document.getElementById("minTradesFilter").value) || 0;
  const tickerQuery = document.getElementById("tickerSearch").value.trim().toUpperCase();
  const adv = readAdvFilter();
  const tradeOnStrats = readTradeOnStrats();
  const prebreak = readPrebreakFilter();
  const minTradesStrats = activeMinTradesStrats(tradeOnStrats, adv);
  // Advance Filter, Trade On, and Pre-Breakout each AND against each other
  // (separate .filter() calls); within Trade On, checking multiple
  // strategies is OR. No user-facing sort control anymore -- always sorted
  // by days-in-trade, newest first (smallest days_held; no open trade
  // anywhere sorts last).
  const allRows = data.tickers.slice()
    .filter(r => !tickerQuery || r.ticker.toUpperCase().includes(tickerQuery))
    .filter(r => matchesMinTrades(r, minTrades, minTradesStrats))
    .filter(r => matchesAdvFilter(r, adv))
    .filter(r => matchesTradeOnFilter(r, tradeOnStrats))
    .filter(r => matchesPrebreakFilter(r, prebreak))
    .sort((a, b) => {
      const da = maxDaysInTrade(a), db = maxDaysInTrade(b);
      if (da === null && db === null) return 0;
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });

  lastFilteredRows = allRows;
  const pageCount = Math.max(1, Math.ceil(allRows.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), pageCount);
  const rows = allRows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  let html = "";
  for (const r of rows) {
    // BREAKOUT (score 5) is the new top state -- fire-card highlight fires
    // on that instead of the old 6/6 gate count.
    const isFire = !!r.prebreak && r.prebreak.score === 4 && !r.earnings_risk;
    html += `<div class="tickercard ${isFire ? "fire" : ""}">
      <div class="cardhead">
        <a class="tklink tk" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(r.ticker)}" target="_blank" rel="noopener noreferrer">${r.ticker}</a>
        <span class="price num">$${r.price.toFixed(2)}</span>
        ${scorebar(r.prebreak, r.earnings_risk)}
        <input type="checkbox" class="cardcheck" data-ticker="${r.ticker}" ${selectedTickers.has(r.ticker) ? "checked" : ""} title="Select for watchlist">
      </div>
      ${SHOW_LEGACY_CONDITIONS && r.conditions ? `<div class="cardsection">
        <span class="lbl">Conditions</span>
        <span class="condgrid">${Object.entries(r.conditions).map(([k, c]) => chip(k, c)).join("")}</span>
      </div>` : ""}
      ${SHOW_PREBREAK && r.prebreak ? `<div class="cardsection">
        <span class="lbl">Pre-Breakout</span>
        <span class="condgrid">${prebreakChips(r.prebreak)}</span>
      </div>` : ""}
      <hr class="divider">
      <div class="scoresections">
        <div class="scorebox"><div class="strategygrid2 ${SHOW_ADX_VCPF ? "" : "solo"}">
          <div class="strategycell"><span class="strategyname">VEXH</span>
            <div class="strategybody">${exhaustionChip(r)}</div></div>
          ${SHOW_ADX_VCPF ? `<div class="strategycell"><span class="strategyname">ADX</span>
            <div class="strategybody">${strategyChips(r.strategy_a, "Strategy A")}</div></div>` : ""}
          ${SHOW_ADX_VCPF ? `<div class="strategycell"><span class="strategyname">VCPF</span>
            <div class="strategybody">${strategyChips(r.strategy_d, "Strategy D")}</div></div>` : ""}
          <div class="strategycell"><span class="strategyname">VCP</span>
            <div class="strategybody">${strategyChips(r.strategy_vcp, "VCP Master")}</div></div>
          <div class="strategycell"><span class="strategyname">VCPO</span>
            <div class="strategybody">${strategyChips(r.strategy_vcpo, "VCPO")}</div></div>
        </div></div>
      </div>
    </div>`;
  }
  // "insufficient history" isn't a real error (usually a recent IPO/listing
  // that hasn't accumulated enough bars yet) -- not worth a card of its own.
  const realErrors = Object.entries(data.errors || {}).filter(([, err]) => err !== "insufficient history");
  if (currentPage === pageCount)
    for (const [tk, err] of realErrors)
      html += `<div class="tickercard err"><div class="cardhead"><span class="tk">${tk}</span></div><span>${err}</span></div>`;
  if (!rows.length && !realErrors.length)
    html = `<p style="color:var(--muted)">No tickers match this filter</p>`;
  document.getElementById("rows").innerHTML = html;
  updateSelectionCount();
  const open = allRows.filter(r => r.open_trade).length;
  const advActive = adv.wrMin > WR_STEPS[0] || adv.pfMin > PF_STEPS[0];
  const prebreakActive = prebreak.phaseMin !== PHASE_STEPS[PHASE_DEFAULT_INDEX][1]
    || prebreak.coilMin > COIL_STEPS[0] || Object.values(prebreak.switches).some(Boolean);
  const filtered = minTrades > 0 || !!tickerQuery || advActive || tradeOnStrats.length > 0 || prebreakActive;
  const countText = filtered
    ? `${allRows.length} of ${data.tickers.length} tickers (filtered)`
    : `${data.tickers.length} tickers`;
  document.getElementById("meta").innerHTML =
    `as of ${new Date(data.asof).toLocaleString()} &middot; ${countText} &middot; ${open} open trade${open === 1 ? "" : "s"}` +
    (data.cached ? " &middot; cached" : " &middot; live");
  renderPager(currentPage, pageCount);
}

function renderPager(page, pageCount) {
  const el = document.getElementById("pager");
  if (pageCount <= 1) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <button id="prevPage" ${page === 1 ? "disabled" : ""}>&larr; Prev</button>
    <span>Page ${page} of ${pageCount}</span>
    <button id="nextPage" ${page === pageCount ? "disabled" : ""}>Next &rarr;</button>`;
  // Data for every ticker is already loaded (server precomputes everything in
  // the background) -- paging is just a client-side re-render, no fetch.
  document.getElementById("prevPage").addEventListener("click", () => { currentPage--; render(lastData); });
  document.getElementById("nextPage").addEventListener("click", () => { currentPage++; render(lastData); });
}
// Progress bar is an ESTIMATE, not a real per-ticker completion signal --
// /api/tickers blocks server-side until every ticker (and its 4 strategy
// evaluations) finish, so there's no live progress to stream. Instead we
// track a rolling average of (elapsed_ms / ticker_count) from real past
// loads in localStorage, and animate toward that estimate.
const AVG_MS_KEY = "dashboardAvgMsPerTicker";
const DEFAULT_AVG_MS_PER_TICKER = 900; // seed guess before any real data exists

function getAvgMsPerTicker() {
  const stored = Number(localStorage.getItem(AVG_MS_KEY));
  return stored > 0 ? stored : DEFAULT_AVG_MS_PER_TICKER;
}
function updateAvgMsPerTicker(elapsedMs, tickerCount) {
  if (!tickerCount) return;
  const measured = elapsedMs / tickerCount;
  const prev = getAvgMsPerTicker();
  // Exponential moving average so one slow/fast run doesn't swing the estimate wildly.
  const next = prev * 0.7 + measured * 0.3;
  localStorage.setItem(AVG_MS_KEY, String(next));
}

let progressTimer = null;
function startProgress(tickerCount) {
  const wrap = document.getElementById("progresswrap");
  const fill = document.getElementById("progressfill");
  const label = document.getElementById("progresslabel");
  const estimatedMs = Math.max(1000, tickerCount * getAvgMsPerTicker());
  const t0 = Date.now();
  wrap.style.display = "flex";
  fill.style.width = "0%";
  const tick = () => {
    const elapsed = Date.now() - t0;
    // Ease toward 92% over the estimate; never claim 100% until actually done.
    const pct = Math.min(92, (elapsed / estimatedMs) * 92);
    fill.style.width = pct.toFixed(1) + "%";
    const remainingMs = Math.max(0, estimatedMs - elapsed);
    label.textContent = `~${Math.ceil(remainingMs / 1000)}s remaining (estimate, ${tickerCount} tickers)`;
  };
  tick();
  progressTimer = setInterval(tick, 250);
  return t0;
}
function finishProgress() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  const wrap = document.getElementById("progresswrap");
  const fill = document.getElementById("progressfill");
  const label = document.getElementById("progresslabel");
  fill.style.width = "100%";
  label.textContent = "done";
  setTimeout(() => { wrap.style.display = "none"; }, 500);
}

function showPageOverlay(text) {
  document.getElementById("pageoverlaytext").textContent = text;
  document.getElementById("pageoverlay").style.display = "flex";
}
function hidePageOverlay() {
  document.getElementById("pageoverlay").style.display = "none";
}

// A plain page load just reads the server's already-precomputed cache (fast).
// refresh=1 forces the server to re-fetch + recompute the WHOLE universe
// synchronously before responding, which is genuinely slow -- that's the
// only case that still needs the progress bar / overlay.
async function load(refresh) {
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  let tickerCount = lastData ? lastData.tickers.length : null;
  if (tickerCount === null) {
    try {
      const metaRes = await fetch("/api/meta");
      tickerCount = (await metaRes.json()).total_tickers;
    } catch (e) { tickerCount = 474; }
  }
  if (refresh) { showPageOverlay("Refreshing all tickers…"); startProgress(tickerCount); }
  const t0 = Date.now();
  try {
    const params = refresh ? "?refresh=1" : "";
    const res = await fetch("/api/tickers" + params);
    const data = await res.json();
    if (refresh) updateAvgMsPerTicker(Date.now() - t0, tickerCount);
    render(data);
  } catch (e) {
    document.getElementById("meta").textContent = "failed to load: " + e;
  } finally {
    hidePageOverlay();
    btn.disabled = false;
    if (refresh) finishProgress();
  }
}
document.getElementById("refresh").addEventListener("click", () => load(true));
document.getElementById("minTradesFilter").addEventListener("change", () => {
  currentPage = 1;
  if (lastData) render(lastData);
});
document.getElementById("tickerSearch").addEventListener("input", () => {
  currentPage = 1;
  if (lastData) render(lastData);
});
document.getElementById("filterToggle").addEventListener("click", () => {
  const controls = document.getElementById("filterControls");
  const nowOpen = controls.classList.toggle("open");
  document.getElementById("filterToggle").setAttribute("aria-expanded", nowOpen);
});

// Advance Filter: build the nested checkbox tree once, then toggle the
// popover open/closed and re-render on every checkbox change. Clicking
// anywhere outside the panel closes it (same pattern as the detail modal).
// Generic wiring shared by both popovers (Advance Filter and Trade On):
// build the panel HTML, keep the count badge in sync, toggle open/closed,
// close on outside click, and re-render on every checkbox change. Returns
// a clearAll() so the page-level "Clear filters" button can reset both.
function setupFilterPopover(containerId, toggleId, panelId, countId, clearBtnId, buildFn, opts = {}) {
  const panel = document.getElementById(panelId);
  const toggle = document.getElementById(toggleId);
  const container = document.getElementById(containerId);
  const countBadge = document.getElementById(countId);
  panel.innerHTML = buildFn();

  // Default (checkbox-based, used by Trade On): count = checked boxes,
  // reset = uncheck all. Advance Filter/Pre-Breakout pass their own
  // countActive/resetToDefault since sliders/radios have no "unchecked"
  // state -- "default" for them means "at the lowest/no-op position".
  const countActive = opts.countActive
    || (() => panel.querySelectorAll("input[type=checkbox]:checked").length);
  const resetToDefault = opts.resetToDefault
    || (() => panel.querySelectorAll("input[type=checkbox]:checked").forEach(cb => cb.checked = false));

  function updateCount() {
    const n = countActive();
    countBadge.textContent = n;
    countBadge.style.display = n > 0 ? "inline-block" : "none";
  }
  function close() {
    panel.style.display = "none";
    toggle.setAttribute("aria-expanded", "false");
  }
  function clearAll() {
    resetToDefault();
    updateCount();
  }

  panel.addEventListener("change", (e) => {
    if (!e.target.matches('input')) return;
    updateCount();
    currentPage = 1;
    if (lastData) render(lastData);
  });
  document.getElementById(clearBtnId).addEventListener("click", () => {
    clearAll();
    currentPage = 1;
    if (lastData) render(lastData);
  });
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const nowOpen = panel.style.display === "none";
    panel.style.display = nowOpen ? "block" : "none";
    toggle.setAttribute("aria-expanded", String(nowOpen));
  });
  document.addEventListener("click", (e) => {
    if (!container.contains(e.target)) close();
  });
  return clearAll;
}
const clearAdvFilter = setupFilterPopover("advFilter", "advFilterToggle", "advFilterPanel",
  "advFilterCount", "advFilterClearBtn", buildAdvFilterPanel, {
    // Strategy radio doesn't count as "active" on its own (always selected,
    // filters nothing by itself) -- only the sliders moving off their true
    // no-op (index 0) counts.
    countActive: () => {
      const adv = readAdvFilter();
      return (adv.wrMin > WR_STEPS[0] ? 1 : 0) + (adv.pfMin > PF_STEPS[0] ? 1 : 0);
    },
    resetToDefault: () => {
      const first = document.querySelector('#advFilterPanel input[name="advStrategy"]');
      if (first) first.checked = true;
      const wrEl = document.getElementById("advWrSlider");
      const pfEl = document.getElementById("advPfSlider");
      if (wrEl) wrEl.value = "0";
      if (pfEl) pfEl.value = "0";
    },
  });
const clearTradeOnFilter = setupFilterPopover("tradeOnFilter", "tradeOnToggle", "tradeOnPanel",
  "tradeOnCount", "tradeOnClearBtn", buildTradeOnPanel);
const clearPrebreakFilter = setupFilterPopover("prebreakFilter", "prebreakToggle", "prebreakPanel",
  "prebreakCount", "prebreakClearBtn", buildPrebreakPanel, {
    // Phase's default (NEUTRAL) is a real floor, not a true no-op (see
    // FILTER_ARCHITECTURE.md), but it still doesn't count as "active" here
    // -- the badge reflects deliberate user narrowing, not the built-in floor.
    // Compared by INDEX (not value) since Phase can move either direction
    // off its default (e.g. down to BEARISH), not just upward.
    countActive: () => {
      const phaseEl = document.getElementById("prebreakPhaseSlider");
      const coilEl = document.getElementById("prebreakCoilSlider");
      const phaseIdx = phaseEl ? Number(phaseEl.value) : PHASE_DEFAULT_INDEX;
      const coilIdx = coilEl ? Number(coilEl.value) : 0;
      let n = (phaseIdx !== PHASE_DEFAULT_INDEX ? 1 : 0) + (coilIdx !== 0 ? 1 : 0);
      const sel = readPrebreakFilter();
      for (const [key] of PREBREAK_SWITCHES) if (sel.switches[key]) n++;
      return n;
    },
    resetToDefault: () => {
      const phaseEl = document.getElementById("prebreakPhaseSlider");
      const coilEl = document.getElementById("prebreakCoilSlider");
      if (phaseEl) phaseEl.value = String(PHASE_DEFAULT_INDEX);
      if (coilEl) coilEl.value = "0";
      document.querySelectorAll('#prebreakPanel input[data-switch]').forEach(cb => cb.checked = false);
    },
  });

document.getElementById("clearFilters").addEventListener("click", () => {
  document.getElementById("tickerSearch").value = "";
  document.getElementById("minTradesFilter").value = "0";
  clearAdvFilter();
  clearTradeOnFilter();
  clearPrebreakFilter();
  currentPage = 1;
  if (lastData) render(lastData);
});

// Watchlist selection controls. Checkboxes are delegated (cards are
// rebuilt from scratch on every render, so per-checkbox listeners would
// leak) -- selection itself survives across pages/re-renders since it's
// keyed by ticker, not by DOM node.
document.getElementById("rows").addEventListener("change", (e) => {
  if (!e.target.classList.contains("cardcheck")) return;
  const tk = e.target.dataset.ticker;
  if (e.target.checked) selectedTickers.add(tk); else selectedTickers.delete(tk);
  updateSelectionCount();
});
document.getElementById("selectAllBtn").addEventListener("click", () => {
  for (const r of lastFilteredRows) selectedTickers.add(r.ticker);
  if (lastData) render(lastData);
});
document.getElementById("clearSelectionBtn").addEventListener("click", () => {
  selectedTickers.clear();
  if (lastData) render(lastData);
});
document.getElementById("addToWatchlistBtn").addEventListener("click", showWatchlistPicker);
document.getElementById("plCalcBtn").addEventListener("click", showPlCalculator);

load(false);
</script>
