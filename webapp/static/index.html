// ---------------- Advance Filter ----------------
// One Strategy radio (which strategy's stats to read) + Win Rate AND
// Profit minimum-threshold sliders. See FILTER_ARCHITECTURE.md.
const ADV_STRATEGIES = [["vcp", "VCP"], ["vcpo", "VCPO"], ["vexh", "VEXH"]];
const ADV_STRAT_KEY = { vcp: "strategy_vcp", vcpo: "strategy_vcpo", vexh: "vexh" };
const WR_STEPS = [0, 50, 70, 75];
const PF_STEPS = [0, 1, 1.5, 2, 2.5, 3.5, 5.0];
// Default floor, not a true zero/off no-op: VCPO/WR>=70/PF>=2.5 had the
// strongest results in practice. Single source of truth for both initial
// page-load state and what "reset"/"Clear" returns to.
const ADV_STRATEGY_DEFAULT = "vcpo";
const ADV_WR_DEFAULT_INDEX = WR_STEPS.indexOf(70);
const ADV_PF_DEFAULT_INDEX = PF_STEPS.indexOf(2.5);

function sliderStepsHtml(steps, suffix) {
  return steps.map(v => `<span>${v}${suffix}</span>`).join("");
}
function buildAdvFilterPanel() {
  const stratRadios = ADV_STRATEGIES.map(([key, label]) =>
    `<label class="advcheck"><input type="radio" name="advStrategy" data-strat="${key}" ${key === ADV_STRATEGY_DEFAULT ? "checked" : ""}> ${label}</label>`
  ).join("");
  return `<div class="advsectionlabel">Strategy</div>
    <div class="advradiorow">${stratRadios}</div>
    <div class="advsliderrow">
      <div class="advslider">
        <div class="advsectionlabel">Win Rate</div>
        <input type="range" id="advWrSlider" min="0" max="${WR_STEPS.length - 1}" step="1" value="${ADV_WR_DEFAULT_INDEX}">
        <div class="advslidersteps">${sliderStepsHtml(WR_STEPS, "%")}</div>
      </div>
      <span class="advand">AND</span>
      <div class="advslider">
        <div class="advsectionlabel">Profit</div>
        <input type="range" id="advPfSlider" min="0" max="${PF_STEPS.length - 1}" step="1" value="${ADV_PF_DEFAULT_INDEX}">
        <div class="advslidersteps">${sliderStepsHtml(PF_STEPS, "")}</div>
      </div>
    </div>
    <div class="advfilterfoot"><button id="advFilterClearBtn" class="clearfilters" type="button">Clear</button></div>`;
}

function advStrategyStats(r, strat) {
  const s = r[ADV_STRAT_KEY[strat]];
  return s ? { wr: s.win_rate, pf: s.profit_factor } : null;
}
function readAdvFilter() {
  const stratEl = document.querySelector('#advFilterPanel input[name="advStrategy"]:checked');
  const wrEl = document.getElementById("advWrSlider");
  const pfEl = document.getElementById("advPfSlider");
  return {
    strategy: stratEl ? stratEl.dataset.strat : ADV_STRATEGIES[0][0],
    wrMin: WR_STEPS[wrEl ? Number(wrEl.value) : 0],
    pfMin: PF_STEPS[pfEl ? Number(pfEl.value) : 0],
  };
}
function matchesAdvFilter(r, adv) {
  // True no-op at index 0 -- don't exclude a ticker for lacking data on a
  // strategy that isn't actually being filtered on yet.
  if (adv.wrMin <= WR_STEPS[0] && adv.pfMin <= PF_STEPS[0]) return true;
  const stats = advStrategyStats(r, adv.strategy);
  if (!stats) return false;
  return stats.wr >= adv.wrMin && stats.pf >= adv.pfMin;
}

// ---------------- Trade On filter ----------------
// ANDed against Advance Filter; "open trade on ANY checked strategy" (OR
// among the checked strategies themselves).
const TRADE_ON_STRATS = [["vcp", "VCP"], ["vcpo", "VCPO"], ["vexh", "VEXH"]];

function buildTradeOnPanel() {
  const boxes = TRADE_ON_STRATS.map(([key, label]) =>
    `<label class="advcheck"><input type="checkbox" data-strat="${key}"> ${label}</label>`
  ).join("");
  return `<div class="advmetric">${boxes}</div>`
    + `<div class="advfilterfoot"><button id="tradeOnClearBtn" class="clearfilters" type="button">Clear</button></div>`;
}
function isStrategyActive(r, key) {
  const s = r[ADV_STRAT_KEY[key]];
  return !!(s && s.open_position);
}
function readTradeOnStrats() {
  return [...document.querySelectorAll("#tradeOnPanel input[type=checkbox]:checked")].map(cb => cb.dataset.strat);
}
function matchesTradeOnFilter(r, strats) {
  return strats.length === 0 || strats.some(key => isStrategyActive(r, key));
}

// ---------------- Pre-Breakout filter ----------------
// ANDed against Advance Filter and Trade On. Phase and Coil Energy are
// minimum-threshold sliders; the 4 boolean metrics are switches (off = no
// filter, on = require true). All 6 AND together. See FILTER_ARCHITECTURE.md.
// Phase's default is a real floor, not a true no-op: BULLISH/NEUTRAL/
// BEARISH tickers are hidden even with nothing else touched. COILING (BULL)
// (not NEUTRAL) keeps COILING setups -- one of the best watchlist additions
// in practice -- while still cutting BULLISH/NEUTRAL noise below it.
const PHASE_STEPS = [
  ["BEARISH", -2], ["NEUTRAL", 0], ["BULLISH", 1],
  ["COILING (BULL)", 2], ["PRE-BREAKOUT", 4], ["BREAKOUT", 5],
];
const PHASE_DEFAULT_INDEX = 3; // COILING (BULL)
const COIL_STEPS = [0, 5, 8, 12, 15];
// Default floor: 5+ bars cuts the 0-bar EXPANDED setups while keeping
// anything with meaningful compression building.
const COIL_DEFAULT_INDEX = COIL_STEPS.indexOf(5);
const PREBREAK_SWITCHES = [
  ["squeeze", "Volatility Squeeze", "bb_squeeze"],
  ["volume", "Volume Dry-up", "vol_dry_up"],
  ["resistance", "Clustering At Ceiling", "near_resistance"],
  ["trend", "Trend Filter", "is_bullish_trend"],
];

function buildPrebreakPanel() {
  const phaseLabels = sliderStepsHtml(PHASE_STEPS.map(([name]) => name), "");
  const coilLabels = COIL_STEPS.map((v, i) => `<span>${i === 0 ? "0(off)" : v + "+"}</span>`).join("");
  const switches = PREBREAK_SWITCHES.map(([key, label]) =>
    `<label class="switchrow">${label}<span class="switch"><input type="checkbox" data-switch="${key}"><span class="switchtrack"></span></span></label>`
  ).join("");
  return `<div class="advsectionlabel">Phase</div>
    <input type="range" id="prebreakPhaseSlider" min="0" max="${PHASE_STEPS.length - 1}" step="1" value="${PHASE_DEFAULT_INDEX}">
    <div class="advslidersteps">${phaseLabels}</div>
    <div class="switchgrid">${switches}</div>
    <div class="advsectionlabel">Coil Energy Build-up</div>
    <input type="range" id="prebreakCoilSlider" min="0" max="${COIL_STEPS.length - 1}" step="1" value="${COIL_DEFAULT_INDEX}">
    <div class="advslidersteps">${coilLabels}</div>
    <div class="advfilterfoot"><button id="prebreakClearBtn" class="clearfilters" type="button">Clear</button></div>`;
}
function readPrebreakFilter() {
  const phaseEl = document.getElementById("prebreakPhaseSlider");
  const coilEl = document.getElementById("prebreakCoilSlider");
  const switches = {};
  for (const [key] of PREBREAK_SWITCHES) {
    const cb = document.querySelector(`#prebreakPanel input[data-switch="${key}"]`);
    switches[key] = !!(cb && cb.checked);
  }
  return {
    phaseMin: PHASE_STEPS[phaseEl ? Number(phaseEl.value) : PHASE_DEFAULT_INDEX][1],
    coilMin: COIL_STEPS[coilEl ? Number(coilEl.value) : 0],
    switches,
  };
}
function matchesPrebreakFilter(r, sel) {
  const pb = r.prebreak;
  // Fail OPEN on missing data (backend couldn't evaluate) rather than
  // hard-excluding the ticker.
  if (!pb) return true;
  if (pb.score < sel.phaseMin) return false;
  if (pb.squeeze_counter < sel.coilMin) return false;
  for (const [key, , field] of PREBREAK_SWITCHES) {
    if (sel.switches[key] && !pb[field]) return false;
  }
  return true;
}

function strategyNTrades(r, key) {
  const s = r[ADV_STRAT_KEY[key]];
  return s ? s.n_trades : null;
}
// Min Trades scoped to whichever strategy is active via Trade On/Advance
// Filter -- otherwise it's dominated by whichever strategy trades most
// often (VCP fires far more than VEXH's strict gate setup). Falls back to
// all three when neither filter narrows to specific strategies. Advance
// Filter's Strategy radio only counts as "narrowing" once a slider has
// moved off its no-op default (0) -- a radio is always selected, so that
// alone doesn't count.
function activeMinTradesStrats(tradeOnStrats, adv) {
  const strats = new Set(tradeOnStrats);
  if (adv.wrMin > WR_STEPS[0] || adv.pfMin > PF_STEPS[0]) strats.add(adv.strategy);
  return strats.size ? [...strats] : ["vexh", "vcp", "vcpo"];
}
function matchesMinTrades(r, minTrades, strats) {
  if (minTrades <= 0) return true;
  return strats.some(key => (strategyNTrades(r, key) ?? -1) >= minTrades);
}

// WR/PF tiers mirror the scoring system's dimension-1 breakpoints (75/70/65%
// WR, 3.5/2.5/2.0 PF) so a card's badge color agrees with its setup_score
// instead of using an unrelated scale. See color-code.md.
function wrColorClass(wr) {
  if (wr >= 75) return "ok";      // scoring tier 1 (PF 3.5+/WR 75+)
  if (wr >= 70) return "mid";     // scoring tier 2 (PF 2.5+/WR 70+)
  if (wr >= 65) return "neutral"; // scoring tier 3 (PF 2.0+/WR 65+)
  return "no";
}
function pfColorClass(pf) {
  if (pf >= 3.5) return "ok";      // strong edge
  if (pf >= 2.5) return "mid";     // acceptable, watch
  if (pf >= 2.0) return "neutral"; // borderline
  return "no";
}
// Below 15 the default Min Trades filter already excludes it; this tier is
// mainly visible once filters are relaxed.
function tradeCountColorClass(n) {
  if (n >= 25) return "ok";
  if (n >= 20) return "mid";
  if (n >= 15) return "neutral";
  return "no";
}
// pending adds a badge when THIS strategy's own signal fired on the latest
// close with no position open yet -- fills at the next bar's open, not today.
function statBadges(active, days, nTrades, wr, pf, modalId, pending) {
  // Win count derived from win_rate% and n_trades (backend only stores the
  // percentage, not the raw win count).
  const wins = Math.round(wr / 100 * nTrades);
  const badges = [];
  if (active) badges.push(["active", `Open -${days}D`]);
  if (pending) badges.push(["pending", "PENDING"]);
  badges.push([tradeCountColorClass(nTrades), `T ${nTrades}`]);
  badges.push([wrColorClass(wr), `WR ${wr.toFixed(2)}%(${wins}/${nTrades})`]);
  badges.push([pfColorClass(pf), `PF ${pf.toFixed(2)}`]);
  return `<span class="badgerow">` + badges.map(([cls, text]) =>
    `<span class="chip ${cls} hasdetail" onclick="showModal('${modalId}')">${text}</span>`
  ).join("") + `</span>`;
}

function strategyModal(name, s, ticker, stratKey) {
  const rows = [
    modalRow("Trades", s.n_trades),
    modalRow("Profit factor", s.profit_factor),
    modalRow("Win rate", s.win_rate + "%"),
  ];
  if (s.first_trade_date) rows.push(modalRow("Since", s.first_trade_date));
  const op = s.open_position;
  if (op) {
    const sign = op.unrealized_pct >= 0 ? "+" : "";
    rows.push('<div class="modalsep"></div>');
    rows.push(modalRow("Entry", `${op.entry_date} @ ${op.entry_price}`));
    rows.push(modalRow("Target", op.target));
    rows.push(modalRow("Unrealized", `${sign}${op.unrealized_pct}%`));
    rows.push(modalRow("Bars held", op.days_held));
    const ttSign = op.to_tp_pct > 0 ? "+" : "";
    rows.push('<div class="modalsep"></div>');
    rows.push(modalRow("To TP %", `${ttSign}${op.to_tp_pct.toFixed(1)}%`));
  }
  if (s.avg_mae_wins_pct != null) {
    const limitHint = op ? ` [&rarr; limit at $${(op.entry_price * (1 - s.avg_mae_wins_pct / 100)).toFixed(2)}]` : "";
    if (!op) rows.push('<div class="modalsep"></div>');
    rows.push(modalRow("Avg MAE (wins)", `-${s.avg_mae_wins_pct}%${limitHint}`));
    if (s.pct_near_zero_mae != null) rows.push(modalRow("Wins w/ MAE&lt;1%", s.pct_near_zero_mae + "%"));
  }
  if (s.avg_mfe_wins_pct != null) rows.push(modalRow("Avg MFE (wins)", `+${s.avg_mfe_wins_pct}%`));
  rows.push('<div class="modalsep"></div>');
  rows.push(modalRow("Avg Days", s.avg_trade_days ?? "&mdash;"));
  rows.push('<div class="modalsep"></div>');
  rows.push(modalRow("Last 5 TP %", last5(s.last5_trades)));
  if (s.verdict) {
    rows.push('<div class="modalsep"></div>');
    rows.push(`<div class="modalnote"><b>${s.verdict}</b>: ${s.verdict_reason || ""}</div>`);
  }
 
  rows.push('<div class="modalsep"></div>');
  rows.push(`<button type="button" class="tradebtn" onclick="showTradeModal('${ticker}','${stratKey}')">TRADE</button>`);
  return registerModal(name, rows);
}

function strategyChips(s, name, ticker, stratKey) {
  if (!s) return '<span class="chip neutral">&mdash;</span>';
  const id = strategyModal(name, s, ticker, stratKey);
  const days = s.open_position ? s.open_position.days_held : null;
  const pending = !!(s.signal_today && !s.open_position);
  return statBadges(!!s.open_position, days, s.n_trades, s.win_rate, s.profit_factor, id, pending);
}

function maxDaysInTrade(r) {
  let max = null;
  for (const s of [r.vexh, r.strategy_vcp, r.strategy_vcpo]) {
    if (s && s.open_position) {
      max = max === null ? s.open_position.days_held : Math.max(max, s.open_position.days_held);
    }
  }
  return max;
}
// Checked across all 3 strategies (not scoped to Advance Filter's selection)
// so a card sorts to the front the moment any strategy has a fresh signal.
function hasPendingSignal(r) {
  for (const s of [r.vexh, r.strategy_vcp, r.strategy_vcpo]) {
    if (s && s.signal_today && !s.open_position) return true;
  }
  return false;
}
const PAGE_SIZE = 9;
let lastData = null;
let currentPage = 1;

// selectedTickers is in-memory only (not persisted -- only saved watchlists
// themselves persist), survives across pages/filter changes since it's
// keyed by ticker.
let selectedTickers = new Set();
let lastFilteredRows = [];
const WATCHLIST_NAMES = ["VCP List", "VEXH List", "VCPO List"];

function loadWatchlists() {
  try {
    return JSON.parse(localStorage.getItem("watchlists")) || {};
  } catch {
    return {};
  }
}
function saveWatchlists(lists) {
  localStorage.setItem("watchlists", JSON.stringify(lists));
  syncWatchlistTickers(lists);
}
// Tells the server which tickers are watchlisted, so the background fetch/compute loop keeps
// them alive even if one later fails universe re-screening. Fire-and-forget -- watchlists
// themselves stay in localStorage, so a failed sync just means the next save/load retries.
function syncWatchlistTickers(lists) {
  const tickers = [...new Set(Object.values(lists).flat())];
  fetch("/api/watchlist-tickers", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(tickers),
  }).catch(() => {});
}
function addSelectedToWatchlist(name) {
  const lists = loadWatchlists();
  const existing = new Set(lists[name] || []);
  for (const tk of selectedTickers) existing.add(tk);
  lists[name] = [...existing].sort();
  saveWatchlists(lists);
}
function updateSelectionCount() {
  const has = selectedTickers.size > 0;
  document.getElementById("selectionCount").textContent = has ? `${selectedTickers.size} selected` : "";
  document.getElementById("clearSelectionBtn").style.display = has ? "" : "none";
  document.getElementById("addToWatchlistBtn").style.display = has ? "" : "none";
  document.getElementById("exportPdfBtn").style.display = has ? "" : "none";
  document.getElementById("refresh").style.display = has ? "none" : "";
}

function showExportPicker() {
  if (!selectedTickers.size) return;
  document.getElementById("modalBox").innerHTML =
    `<div class="modaltitle">Export ${selectedTickers.size} ticker(s) as&hellip;</div>
     <div class="modalbody watchlistpicker">
       <button type="button" class="watchlistpickbtn" onclick="runExport('pdf')">PDF</button>
       <button type="button" class="watchlistpickbtn" onclick="runExport('csv')">CSV</button>
     </div>`;
  document.getElementById("modalBackdrop").style.display = "flex";
}

// Scoped to the selected tickers and the Advance Filter's current strategy;
// built server-side from the already-computed payloads -- no client-side
// PDF library, no recompute.
async function runExport(format) {
  hideModal();
  const btn = document.getElementById("exportPdfBtn");
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Exporting…";
  try {
    const resp = await fetch(`/api/export/${format}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tickers: Array.from(selectedTickers),
        strategy: ADV_STRAT_KEY[readAdvFilter().strategy],
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      }),
    });
    if (!resp.ok) throw new Error(`export failed (${resp.status})`);
    const disposition = resp.headers.get("Content-Disposition") || "";
    const filenameMatch = disposition.match(/filename=([^;]+)/);
    const today = new Date().toISOString().slice(0, 10);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filenameMatch ? filenameMatch[1].trim() : `exhaustion-export-${today}.${format}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert(`Export failed: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

// Server precomputes every ticker in the background (see webapp/data.py +
// app.py's compute_all()) and this endpoint returns the full in-memory
// result set, so sort/filter/paginate happen here, client-side, across the
// whole universe.
function render(data) {
  lastData = data;
  // Every re-render rebuilds all chips from scratch, so their modal ids
  // would otherwise accumulate forever -- start clean each time.
  modalStore = {};
  modalCounter = 0;
  const minTrades = Number(document.getElementById("minTradesFilter").value) || 0;
  const tickerQuery = document.getElementById("tickerSearch").value.trim().toUpperCase();
  const adv = readAdvFilter();
  const tradeOnStrats = readTradeOnStrats();
  const prebreak = readPrebreakFilter();
  const minTradesStrats = activeMinTradesStrats(tradeOnStrats, adv);
  // Always 3 sort tiers: any strategy PENDING first, then open trades by
  // days-in-trade (newest first, smallest days_held), then everything else.
  const allRows = data.tickers.slice()
    .filter(r => !tickerQuery || r.ticker.toUpperCase().includes(tickerQuery))
    .filter(r => matchesMinTrades(r, minTrades, minTradesStrats))
    .filter(r => matchesAdvFilter(r, adv))
    .filter(r => matchesTradeOnFilter(r, tradeOnStrats))
    .filter(r => matchesPrebreakFilter(r, prebreak))
    .sort((a, b) => {
      const pa = hasPendingSignal(a), pb = hasPendingSignal(b);
      if (pa !== pb) return pa ? -1 : 1;
      const da = maxDaysInTrade(a), db = maxDaysInTrade(b);
      if (da === null && db === null) return 0;
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });

  lastFilteredRows = allRows;
  const pageCount = Math.max(1, Math.ceil(allRows.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), pageCount);
  const rows = allRows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const scoreStrategy = readAdvFilter().strategy;
  let html = "";
  for (const r of rows) {
    // Fire-card highlight/ENTRY tag keys off the 0-10 setup_score's
    // "Exceptional" band, 9-10 (see scoring.md).
    const cardScore = r.setup_score ? r.setup_score[ADV_STRAT_KEY[scoreStrategy]] : null;
    const isFire = cardScore != null && cardScore >= 9 && !r.earnings_risk;
    html += `<div class="tickercard ${isFire ? "fire" : ""}">
      <div class="cardhead">
        <a class="tklink tk" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(r.ticker)}" target="_blank" rel="noopener noreferrer">${r.ticker}</a>
        <span class="price num">$${r.price.toFixed(2)}</span>
        ${scoreBadge(r, scoreStrategy)}
        ${cardScore != null && cardScore >= 9 ? (r.earnings_risk
          ? '<span class="firetag weak" title="earnings report within the entry-avoid window -- engine will not take this entry (validated: holding through earnings drops win rate 62%->51%)">ENTRY (earnings risk)</span>'
          : '<span class="firetag">ENTRY</span>') : ""}
        <input type="checkbox" class="cardcheck" data-ticker="${r.ticker}" ${selectedTickers.has(r.ticker) ? "checked" : ""} title="Select for watchlist">
      </div>
      ${SHOW_PREBREAK && r.prebreak ? `<div class="cardsection">
        <span class="lbl">Pre-Breakout</span>
        <span class="condgrid">${prebreakChips(r.prebreak)}</span>
      </div>` : ""}
      <hr class="divider">
      <div class="scoresections">
        <div class="scorebox"><div class="strategygrid2">
          <div class="strategycell"><span class="strategyname">VEXH</span>
            <div class="strategybody">${strategyChips(r.vexh, "Exhaustion", r.ticker, "vexh")}</div></div>
          <div class="strategycell"><span class="strategyname">VCP</span>
            <div class="strategybody">${strategyChips(r.strategy_vcp, "VCP Master", r.ticker, "strategy_vcp")}</div></div>
          <div class="strategycell"><span class="strategyname">VCPO</span>
            <div class="strategybody">${strategyChips(r.strategy_vcpo, "VCPO", r.ticker, "strategy_vcpo")}</div></div>
        </div></div>
      </div>
    </div>`;
  }
  // "insufficient history" isn't a real error (usually a recent IPO/listing
  // that hasn't accumulated enough bars yet).
  const realErrors = Object.entries(data.errors || {}).filter(([, err]) => err !== "insufficient history");
  if (currentPage === pageCount)
    for (const [tk, err] of realErrors)
      html += `<div class="tickercard err"><div class="cardhead"><span class="tk">${tk}</span></div><span>${err}</span></div>`;
  if (!rows.length && !realErrors.length)
    html = `<p style="color:var(--muted)">No tickers match this filter</p>`;
  document.getElementById("rows").innerHTML = html;
  updateSelectionCount();
  const open = allRows.filter(r => maxDaysInTrade(r) != null).length;
  const advActive = adv.wrMin > WR_STEPS[0] || adv.pfMin > PF_STEPS[0];
  const prebreakActive = prebreak.phaseMin !== PHASE_STEPS[PHASE_DEFAULT_INDEX][1]
    || prebreak.coilMin > COIL_STEPS[0] || Object.values(prebreak.switches).some(Boolean);
  const filtered = minTrades > 0 || !!tickerQuery || advActive || tradeOnStrats.length > 0 || prebreakActive;
  const countText = filtered
    ? `${allRows.length} of ${data.tickers.length} tickers (filtered)`
    : `${data.tickers.length} tickers`;
  document.getElementById("meta").innerHTML =
    `as of ${new Date(data.asof).toLocaleString()} &middot; ${countText} &middot; ${open} open trade${open === 1 ? "" : "s"}` +
    (data.cached ? " &middot; cached" : " &middot; live");
  renderPager(currentPage, pageCount);
}

function renderPager(page, pageCount) {
  const el = document.getElementById("pager");
  if (pageCount <= 1) { el.innerHTML = ""; return; }
  el.innerHTML = `
    <button id="prevPage" ${page === 1 ? "disabled" : ""}>&larr; Prev</button>
    <span>Page ${page} of ${pageCount}</span>
    <button id="nextPage" ${page === pageCount ? "disabled" : ""}>Next &rarr;</button>`;
  document.getElementById("prevPage").addEventListener("click", () => { currentPage--; render(lastData); });
  document.getElementById("nextPage").addEventListener("click", () => { currentPage++; render(lastData); });
}
let progressTimer = null;
function finishProgress() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  const wrap = document.getElementById("progresswrap");
  const fill = document.getElementById("progressfill");
  const label = document.getElementById("progresslabel");
  fill.style.width = "100%";
  label.textContent = "done";
  setTimeout(() => { wrap.style.display = "none"; }, 500);
}

function showPageOverlay(text) {
  document.getElementById("pageoverlaytext").textContent = text;
  document.getElementById("pageoverlay").style.display = "flex";
}
function hidePageOverlay() {
  document.getElementById("pageoverlay").style.display = "none";
}

// fetch_progress -> compute_progress are two sequential backend stages
// (refresh_and_compute()'s data.warm_cache() -> compute_all()), shown as ONE
// continuous bar instead of two independent 0-99% bars that visibly reset
// at the handoff: fetching fills 0-50%, computing 50-100%.
let realProgressTimer = null;
function startRealProgressPolling() {
  const wrap = document.getElementById("progresswrap");
  const fill = document.getElementById("progressfill");
  const label = document.getElementById("progresslabel");
  wrap.style.display = "flex";
  // Reset immediately, before the first poll response lands -- otherwise the
  // bar/label keep whatever finishProgress() last left behind ("done", 100%)
  // during the window where the backend hasn't flipped into "in progress"
  // yet, looking like the refresh already finished when it just started.
  fill.style.width = "0%";
  label.textContent = "Starting…";
  const poll = async () => {
    try {
      const meta = await (await fetch("/api/meta")).json();
      const fp = meta.fetch_progress;
      const cp = meta.compute_progress;
      if (cp && cp.total > 0) {
        const pct = 50 + Math.min(50 - 0.1, (cp.done / cp.total) * 50);
        fill.style.width = pct.toFixed(1) + "%";
        label.textContent = `Now computing… ${cp.done} of ${cp.total} tickers`;
      } else if (fp && fp.total > 0) {
        const pct = Math.min(50, (fp.done / fp.total) * 50);
        fill.style.width = pct.toFixed(1) + "%";
        label.textContent = `Now fetching tickers… ${fp.done} of ${fp.total}`;
      }
    } catch (e) { /* keep showing the last known state */ }
  };
  poll();
  // 500ms: with up to 30 tickers fetching concurrently, a slower poll could
  // let 50+ tickers finish between updates, making the counter look like
  // it's lagging behind the backend's real progress.
  realProgressTimer = setInterval(poll, 500);
}
function stopRealProgressPolling() {
  if (realProgressTimer) { clearInterval(realProgressTimer); realProgressTimer = null; }
}

// The server accepts requests immediately on boot rather than blocking
// startup on the first fetch+compute pass (see app.py's _on_startup), so
// right after a fresh deploy/restart the very first request(s) can
// legitimately come back with asof=null and zero tickers while that pass
// is still running in the background. Poll in that case instead of
// rendering an empty grid.
const FIRST_LOAD_POLL_MS = 3000;
// 100 * 3s = 5 minutes -- generous (a cold fetch+compute of ~2000 tickers
// can take a few minutes) but finite, so a genuinely stuck backend surfaces
// as an error instead of a frozen-looking page.
const FIRST_LOAD_MAX_ATTEMPTS = 100;
let firstLoadAttempts = 0;

function applyRateLimitState(meta) {
  const btn = document.getElementById("refresh");
  const until = meta && meta.rate_limited_until;
  if (until && until * 1000 > Date.now()) {
    const mins = Math.ceil((until * 1000 - Date.now()) / 60000);
    btn.disabled = true;
    btn.title = `Yahoo rate-limited the last refresh attempt -- try again in ~${mins} min.`;
    return true;
  }
  btn.title = "";
  return false;
}

async function load(refresh) {
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  // Only one refresh pass ever runs at a time (server-enforced too, see
  // app.py's _refresh_pass_lock) -- a click while one's in progress must
  // attach to it instead of firing a redundant ?refresh=1.
  let meta = null;
  try {
    meta = await (await fetch("/api/meta")).json();
  } catch (e) { /* refreshInFlight below just treats a failed /api/meta as "not in flight" */ }
  if (applyRateLimitState(meta)) return;
  // fetch_progress/compute_progress are global backend state (see app.py),
  // not scoped to whichever request started them -- so a refresh survives a
  // browser reload even though the JS state tracking it (realProgressTimer,
  // the disabled button) doesn't. Without this check, reloading mid-refresh
  // would silently render old cached data with no progress bar.
  const refreshInFlight = meta
    && (meta.fetch_progress || meta.compute_progress);
  if (refresh || refreshInFlight) {
    // Full-page block only when there's no cached data to keep browsing -- otherwise just
    // the top progress bar, so a refresh (whether the user just clicked it, or one already
    // running elsewhere) doesn't lock the user out of a perfectly usable, if slightly stale, app.
    if (lastData) {
      if (!realProgressTimer) startRealProgressPolling();
    } else {
      showPageOverlay(refreshInFlight ? "Refresh already in progress…" : "Refreshing all tickers…");
      if (!realProgressTimer) startRealProgressPolling();
    }
  }
  if (refreshInFlight) {
    setTimeout(() => load(false), FIRST_LOAD_POLL_MS);
    return;
  }
  try {
    const params = refresh ? "?refresh=1" : "";
    const res = await fetch("/api/tickers" + params);
    const data = await res.json();

    if (refresh) {
      // The server kicks the refresh off in the background and responds
      // immediately (see app.py's /api/tickers) -- this response is the
      // pre-refresh snapshot, NOT the finished result. Fall into the same
      // poll-until-done loop refreshInFlight uses above.
      setTimeout(() => load(false), FIRST_LOAD_POLL_MS);
      return;
    }

    if (!refresh && data.asof === null) {
      let freshMeta = null;
      try {
        freshMeta = await (await fetch("/api/meta")).json();
      } catch (e) { /* fall through to the normal retry/cap handling below */ }
      if (applyRateLimitState(freshMeta)) {
        stopRealProgressPolling();
        showPageOverlay("Yahoo rate-limited the last refresh attempt -- see the Refresh button for when to retry.");
        return;
      }
      firstLoadAttempts++;
      if (firstLoadAttempts >= FIRST_LOAD_MAX_ATTEMPTS) {
        stopRealProgressPolling();
        showPageOverlay("Still waiting on the server after 5 minutes — something may be stuck. Reloading the page will try again.");
        btn.disabled = false;
        return;
      }
      showPageOverlay("Loading first dataset…");
      if (!realProgressTimer) startRealProgressPolling();
      // Deliberately left disabled (not re-enabled here) -- there's nothing
      // useful to refresh yet, and clicking it mid-cold-start would stack a
      // second full re-fetch on top of the one already running.
      setTimeout(() => load(false), FIRST_LOAD_POLL_MS);
      return;
    }

    firstLoadAttempts = 0;
    stopRealProgressPolling();
    render(data);
    hidePageOverlay();
    if (!applyRateLimitState(meta)) btn.disabled = false;
    // Unconditional, not gated on refresh -- startRealProgressPolling() shows
    // progresswrap on BOTH the manual-Refresh and cold-start paths, so it must
    // be hidden on both.
    finishProgress();
  } catch (e) {
    stopRealProgressPolling();
    document.getElementById("meta").textContent = "failed to load: " + e;
    hidePageOverlay();
    btn.disabled = false;
    finishProgress();
  }
}
document.getElementById("refresh").addEventListener("click", () => load(true));
document.getElementById("minTradesFilter").addEventListener("change", () => {
  currentPage = 1;
  if (lastData) render(lastData);
});
document.getElementById("tickerSearch").addEventListener("input", () => {
  currentPage = 1;
  if (lastData) render(lastData);
});
document.getElementById("filterToggle").addEventListener("click", () => {
  const controls = document.getElementById("filterControls");
  const nowOpen = controls.classList.toggle("open");
  document.getElementById("filterToggle").setAttribute("aria-expanded", nowOpen);
});

// Generic wiring shared by the three filter popovers: build the panel HTML,
// keep the count badge in sync, toggle open/closed, close on outside click,
// and re-render on every checkbox change. Returns a clearAll() so the
// page-level "Clear filters" button can reset all three.
function setupFilterPopover(containerId, toggleId, panelId, countId, clearBtnId, buildFn, opts = {}) {
  const panel = document.getElementById(panelId);
  const toggle = document.getElementById(toggleId);
  const container = document.getElementById(containerId);
  const countBadge = document.getElementById(countId);
  panel.innerHTML = buildFn();

  // Default (checkbox-based, used by Trade On): count = checked boxes,
  // reset = uncheck all. Advance Filter/Pre-Breakout pass their own
  // countActive/resetToDefault since sliders/radios have no "unchecked" state.
  const countActive = opts.countActive
    || (() => panel.querySelectorAll("input[type=checkbox]:checked").length);
  const resetToDefault = opts.resetToDefault
    || (() => panel.querySelectorAll("input[type=checkbox]:checked").forEach(cb => cb.checked = false));

  function updateCount() {
    const n = countActive();
    countBadge.textContent = n;
    countBadge.style.display = n > 0 ? "inline-block" : "none";
  }
  function close() {
    panel.style.display = "none";
    toggle.setAttribute("aria-expanded", "false");
  }
  function clearAll() {
    resetToDefault();
    updateCount();
  }

  panel.addEventListener("change", (e) => {
    if (!e.target.matches('input')) return;
    updateCount();
    currentPage = 1;
    if (lastData) render(lastData);
  });
  document.getElementById(clearBtnId).addEventListener("click", () => {
    clearAll();
    currentPage = 1;
    if (lastData) render(lastData);
  });
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const nowOpen = panel.style.display === "none";
    panel.style.display = nowOpen ? "block" : "none";
    toggle.setAttribute("aria-expanded", String(nowOpen));
  });
  document.addEventListener("click", (e) => {
    if (!container.contains(e.target)) close();
  });
  return clearAll;
}
const clearAdvFilter = setupFilterPopover("advFilter", "advFilterToggle", "advFilterPanel",
  "advFilterCount", "advFilterClearBtn", buildAdvFilterPanel, {
    // Strategy radio doesn't count as "active" (always selected, filters
    // nothing by itself) -- only sliders moving off the default floor counts.
    countActive: () => {
      const wrEl = document.getElementById("advWrSlider");
      const pfEl = document.getElementById("advPfSlider");
      const wrIdx = wrEl ? Number(wrEl.value) : ADV_WR_DEFAULT_INDEX;
      const pfIdx = pfEl ? Number(pfEl.value) : ADV_PF_DEFAULT_INDEX;
      return (wrIdx !== ADV_WR_DEFAULT_INDEX ? 1 : 0) + (pfIdx !== ADV_PF_DEFAULT_INDEX ? 1 : 0);
    },
    // "Reset"/"Clear" returns to the recommended default floor, not a true
    // zero/off no-op.
    resetToDefault: () => {
      const target = document.querySelector(`#advFilterPanel input[name="advStrategy"][data-strat="${ADV_STRATEGY_DEFAULT}"]`);
      if (target) target.checked = true;
      const wrEl = document.getElementById("advWrSlider");
      const pfEl = document.getElementById("advPfSlider");
      if (wrEl) wrEl.value = String(ADV_WR_DEFAULT_INDEX);
      if (pfEl) pfEl.value = String(ADV_PF_DEFAULT_INDEX);
    },
  });
const clearTradeOnFilter = setupFilterPopover("tradeOnFilter", "tradeOnToggle", "tradeOnPanel",
  "tradeOnCount", "tradeOnClearBtn", buildTradeOnPanel);
const clearPrebreakFilter = setupFilterPopover("prebreakFilter", "prebreakToggle", "prebreakPanel",
  "prebreakCount", "prebreakClearBtn", buildPrebreakPanel, {
    // Phase and Coil Energy's defaults are real floors (see
    // FILTER_ARCHITECTURE.md), but neither counts as "active" here -- the
    // badge reflects deliberate narrowing beyond the built-in floor.
    // Compared by INDEX since Phase can move either direction off default.
    countActive: () => {
      const phaseEl = document.getElementById("prebreakPhaseSlider");
      const coilEl = document.getElementById("prebreakCoilSlider");
      const phaseIdx = phaseEl ? Number(phaseEl.value) : PHASE_DEFAULT_INDEX;
      const coilIdx = coilEl ? Number(coilEl.value) : COIL_DEFAULT_INDEX;
      let n = (phaseIdx !== PHASE_DEFAULT_INDEX ? 1 : 0) + (coilIdx !== COIL_DEFAULT_INDEX ? 1 : 0);
      const sel = readPrebreakFilter();
      for (const [key] of PREBREAK_SWITCHES) if (sel.switches[key]) n++;
      return n;
    },
    resetToDefault: () => {
      const phaseEl = document.getElementById("prebreakPhaseSlider");
      const coilEl = document.getElementById("prebreakCoilSlider");
      if (phaseEl) phaseEl.value = String(PHASE_DEFAULT_INDEX);
      if (coilEl) coilEl.value = String(COIL_DEFAULT_INDEX);
      document.querySelectorAll('#prebreakPanel input[data-switch]').forEach(cb => cb.checked = false);
    },
  });

const MIN_TRADES_DEFAULT = 15;
document.getElementById("clearFilters").addEventListener("click", () => {
  document.getElementById("tickerSearch").value = "";
  document.getElementById("minTradesFilter").value = String(MIN_TRADES_DEFAULT);
  clearAdvFilter();
  clearTradeOnFilter();
  clearPrebreakFilter();
  currentPage = 1;

});

// Checkboxes are delegated (cards are rebuilt from scratch on every render,
// so per-checkbox listeners would leak).
document.getElementById("rows").addEventListener("change", (e) => {
  if (!e.target.classList.contains("cardcheck")) return;
  const tk = e.target.dataset.ticker;
  if (e.target.checked) selectedTickers.add(tk); else selectedTickers.delete(tk);
  updateSelectionCount();
});
document.getElementById("selectAllBtn").addEventListener("click", () => {
  for (const r of lastFilteredRows) selectedTickers.add(r.ticker);
  if (lastData) render(lastData);
});
document.getElementById("clearSelectionBtn").addEventListener("click", () => {
  selectedTickers.clear();
  if (lastData) render(lastData);
});
document.getElementById("addToWatchlistBtn").addEventListener("click", showWatchlistPicker);
document.getElementById("exportPdfBtn").addEventListener("click", showExportPicker);
document.getElementById("plCalcBtn").addEventListener("click", showPlCalculator);

load(false);

// Catches a refresh that starts AFTER this tab already loaded (background 2h loop, or
// someone else clicking Refresh) -- load()'s own refreshInFlight check only runs once, at
// page-load time, so a tab left open has no way to notice one starting later on its own.
// /api/meta is in-memory reads only, no DB/network (see app.py), so this idle poll is cheap
// even left running indefinitely.
const BACKGROUND_WATCH_MS = 20000;
async function checkForBackgroundRefresh() {
  let meta;
  try {
    meta = await (await fetch("/api/meta")).json();
  } catch (e) {
    return; // try again next tick
  }
  applyRateLimitState(meta);
  // Don't double up with an already-visible progress bar.
  if (realProgressTimer) return;
  if (!(meta.fetch_progress || meta.compute_progress)) return;

  startRealProgressPolling();
  const waitUntilDone = async () => {
    let m;
    try {
      m = await (await fetch("/api/meta")).json();
    } catch (e) {
      setTimeout(waitUntilDone, BACKGROUND_WATCH_MS);
      return;
    }
    if (m.fetch_progress || m.compute_progress) {
      setTimeout(waitUntilDone, BACKGROUND_WATCH_MS);
      return;
    }
    stopRealProgressPolling();
    finishProgress();
    try {
      const data = await (await fetch("/api/tickers")).json();
      if (data.asof !== null) render(data);
    } catch (e) { /* keep showing the last rendered data */ }
  };
  setTimeout(waitUntilDone, BACKGROUND_WATCH_MS);
}
setInterval(checkForBackgroundRefresh, BACKGROUND_WATCH_MS);

// ---------------- Notifications ----------------
async function pollUnreadNotifications() {
  let list;
  try {
    list = await (await fetch("/api/notifications?unread=1")).json();
  } catch (e) {
    return;
  }
  const countEl = document.getElementById("notifBellCount");
  if (list.length > 0) {
    countEl.textContent = list.length > 99 ? "99+" : String(list.length);
    countEl.style.display = "";
  } else {
    countEl.style.display = "none";
  }
}
pollUnreadNotifications();
setInterval(pollUnreadNotifications, BACKGROUND_WATCH_MS);

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

async function showNotificationsModal() {
  document.getElementById("modalBox").innerHTML = `
    <div class="modaltitle">Notifications</div>
    <div class="modalbody" id="notifModalBody">
      <div class="notiflist" id="notifList"><div class="modalnote">Loading&hellip;</div></div>
    </div>`;
  document.getElementById("modalBackdrop").style.display = "flex";
  await renderNotificationsList();
}

async function renderNotificationsList() {
  const el = document.getElementById("notifList");
  let list;
  try {
    list = await (await fetch("/api/notifications")).json();
  } catch (e) {
    el.innerHTML = `<div class="modalnote">Failed to load: ${e}</div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="modalnote">No notifications yet.</div>`;
    return;
  }
  el.innerHTML = list.map(n => `
    <div class="notifrow ${n.read_at ? "" : "unread"}" ${n.read_at ? "" : `onclick="markNotificationRead(${n.id})"`}>
      <span class="msg">${n.message}</span>
      <span class="when">${timeAgo(n.created_at)}</span>
    </div>`).join("");
}

async function markNotificationRead(id) {
  try {
    await fetch(`/api/notifications/${id}/read`, { method: "POST" });
  } catch (e) { /* best-effort; row just stays marked unread until next poll retries the read */ }
  await renderNotificationsList();
  pollUnreadNotifications();
}
