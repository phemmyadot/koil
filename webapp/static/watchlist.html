<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlists</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a2333; --muted: #67718a;
    --line: #e3e7ee; --green: #157f3d; --green-bg: #e5f4ea; --red: #b3261e;
    --red-bg: #fbeae9; --accent: #2554c7; --accent-bg: #e8eefb; --gold-bg: #fdf3d8; --gold: #8a6d1a;
    --blue: #0d6efd; --blue-bg: #e3f0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141c; --panel: #171d29; --text: #e6eaf2; --muted: #8b94a8;
      --line: #262e3f; --green: #4ecb7d; --green-bg: #12301e; --red: #f2726b;
      --red-bg: #391513; --accent: #0b3191; --accent-bg: #1a2540; --gold-bg: #33290f; --gold: #e8c96a;
      --blue: #4d9dff; --blue-bg: #0f2c52;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 10px 24px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0; }
  a.back { color: var(--accent); text-decoration: none; font-size: 13px; }
  a.back:hover { text-decoration: underline; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .colhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
             margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .colhead h2 { font-size: 14px; margin: 0; flex: 1 1 auto; }
  .colhead .count { color: var(--muted); font-size: 12px; }
  .colhead input[type=checkbox] { cursor: pointer; }
  .colactions { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .rmselbtn { background: none; border: 1px solid var(--line); color: var(--muted);
              border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  .rmselbtn:hover { color: var(--red); border-color: var(--red); }
  .wlrow { display: flex; align-items: center; justify-content: space-between; gap: 8px;
           padding: 6px 0; border-bottom: 1px solid var(--line); }
  .wlrow:last-child { border-bottom: 0; }
  .wlrow input[type=checkbox] { cursor: pointer; flex: 0 0 auto; }
  .wlrow .tk { flex: 0 0 auto; }
  .wlrow .badgerow { flex: 1 1 auto; justify-content: flex-end; }
  .wlrow a.tk { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--muted);
                font-weight: 700; font-size: 13px; }
  .wlrow a.tk:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 5px;
          padding: 2px 6px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.ok { background: var(--green-bg); color: var(--green); }
  .chip.no { background: var(--red-bg); color: var(--red); }
  .chip.mid { background: var(--gold-bg); color: var(--gold); }
  .chip.neutral { background: var(--line); color: var(--muted); }
  .chip.active { background: var(--blue-bg); color: var(--blue); }
  .badgerow { display: flex; flex-wrap: wrap; gap: 4px; }
  .rmbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px;
           line-height: 1; padding: 2px 4px; }
  .rmbtn:hover { color: var(--red); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  @media (max-width: 720px) {
    .wrap { padding: 10px 8px 24px; }
    header { flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; }
    h1 { font-size: 16px; }
    .col { padding: 12px; }
    .wlrow { flex-wrap: wrap; }
    .wlrow .badgerow { flex-basis: 100%; justify-content: flex-start; order: 3; }
    .colactions { justify-content: flex-start; }
    .rmselbtn { padding: 6px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Watchlists</h1>
    <a class="back" href="index.html">&larr; Back to dashboard</a>
  </header>
  <div class="cols" id="cols">
    <p class="empty">Loading&hellip;</p>
  </div>
</div>
<script>
const WATCHLIST_NAMES = ["VCP List", "VEXH List", "VCPO List"];
// Which strategy's stats to show per list -- "vexh" reads top-level fields,
// the others read that strategy's baseline stats object.
const LIST_STRAT_KEY = { "VCP List": "strategy_vcp", "VEXH List": null, "VCPO List": "strategy_vcpo" };

function loadWatchlists() {
  try {
    return JSON.parse(localStorage.getItem("watchlists")) || {};
  } catch {
    return {};
  }
}
function saveWatchlists(lists) {
  localStorage.setItem("watchlists", JSON.stringify(lists));
}
function removeFromWatchlist(name, ticker) {
  const lists = loadWatchlists();
  lists[name] = (lists[name] || []).filter(t => t !== ticker);
  saveWatchlists(lists);
  selected[name].delete(ticker);
  render();
}
function removeSelected(name) {
  const lists = loadWatchlists();
  lists[name] = (lists[name] || []).filter(t => !selected[name].has(t));
  saveWatchlists(lists);
  selected[name].clear();
  render();
}
function toggleTicker(name, ticker, checked) {
  if (checked) selected[name].add(ticker); else selected[name].delete(ticker);
  updateColActions(name);
}
function toggleAll(name, checked) {
  const lists = loadWatchlists();
  const tickers = lists[name] || [];
  if (checked) tickers.forEach(t => selected[name].add(t));
  else selected[name].clear();
  render();
}
function slug(name) { return name.replace(/\s+/g, "_"); }
function updateColActions(name) {
  const actions = document.getElementById(`actions_${slug(name)}`);
  if (actions) actions.style.display = selected[name].size ? "flex" : "none";
  const all = document.getElementById(`selall_${slug(name)}`);
  if (all) {
    const lists = loadWatchlists();
    const total = (lists[name] || []).length;
    all.checked = total > 0 && selected[name].size === total;
  }
}

// Same color grading/badge shape as the dashboard's statBadges() -- O is
// blue while active else omitted, WR/PF/T each get their own independent
// grading. WR/PF tiers mirror the scoring system's dimension-1 breakpoints
// (3/2/1/0 points at 75/70/65% WR, 3.5/2.5/2.0 PF). Keep in sync with
// index.html's copy of these same four functions -- see color-code.md.
function wrColorClass(wr) {
  if (wr >= 75) return "ok";
  if (wr >= 70) return "mid";
  if (wr >= 65) return "neutral";
  return "no";
}
function pfColorClass(pf) {
  if (pf >= 3.5) return "ok";
  if (pf >= 2.5) return "mid";
  if (pf >= 2.0) return "neutral";
  return "no";
}
function tradeCountColorClass(n) {
  if (n >= 25) return "ok";
  if (n >= 20) return "mid";
  if (n >= 15) return "neutral";
  return "no";
}
function statBadgesHtml(active, days, nTrades, wr, pf) {
  const wins = Math.round(wr / 100 * nTrades);
  const badges = [];
  if (active) badges.push(["active", `O-${days}`]);
  badges.push([tradeCountColorClass(nTrades), `T${nTrades}`]);
  badges.push([wrColorClass(wr), `WR${wr}%(${wins}/${nTrades})`]);
  badges.push([pfColorClass(pf), `PF${pf}`]);
  return `<span class="badgerow">` + badges.map(([cls, text]) =>
    `<span class="chip ${cls}">${text}</span>`
  ).join("") + `</span>`;
}
function statsFor(row, listName) {
  if (!row) return null;
  const key = LIST_STRAT_KEY[listName];
  if (key === null) {
    return { n_trades: row.n_trades, win_rate: row.win_rate, profit_factor: row.profit_factor,
             active: !!row.open_trade, days: row.open_trade ? row.open_trade.bars_held : null };
  }
  const s = row[key];
  if (!s || !s.baseline) return null;
  const b = s.baseline;
  return { n_trades: b.n_trades, win_rate: b.win_rate, profit_factor: b.profit_factor,
           active: b.in_position, days: b.open_position ? b.open_position.days_held : null };
}

let byTicker = {};
// Per-list selection (not persisted -- ephemeral working state, same as the
// dashboard's own ticker selection).
const selected = Object.fromEntries(WATCHLIST_NAMES.map(n => [n, new Set()]));

// Active (in-trade) tickers first, sorted by days held closest to 0 (most
// recently entered); everything else follows, sorted by win rate descending.
// No-data tickers sort to the very end.
function sortByLatestTrade(tickers, listName) {
  return tickers.slice().sort((a, b) => {
    const sa = statsFor(byTicker[a], listName), sb = statsFor(byTicker[b], listName);
    if (!sa && !sb) return a.localeCompare(b);
    if (!sa) return 1;
    if (!sb) return -1;
    if (sa.active !== sb.active) return sa.active ? -1 : 1;
    if (sa.active) return (sa.days ?? Infinity) - (sb.days ?? Infinity);
    return sb.win_rate - sa.win_rate;
  });
}

function render() {
  const lists = loadWatchlists();
  const cols = document.getElementById("cols");
  cols.innerHTML = WATCHLIST_NAMES.map(name => {
    const tickers = sortByLatestTrade(lists[name] || [], name);
    const rowsHtml = tickers.length
      ? tickers.map(tk => {
          const stats = statsFor(byTicker[tk], name);
          const badges = stats
            ? statBadgesHtml(stats.active, stats.days, stats.n_trades, stats.win_rate, stats.profit_factor)
            : `<span class="chip neutral">no data</span>`;
          const checked = selected[name].has(tk) ? "checked" : "";
          return `<div class="wlrow">
            <input type="checkbox" ${checked} onchange="toggleTicker('${name}', '${tk}', this.checked)">
            <a class="tk" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(tk)}" target="_blank" rel="noopener noreferrer">${tk}</a>
            ${badges}
            <button class="rmbtn" type="button" title="Remove" onclick="removeFromWatchlist('${name}', '${tk}')">&times;</button>
          </div>`;
        }).join("")
      : `<p class="empty">No tickers yet -- add some from the dashboard.</p>`;
    const allChecked = tickers.length > 0 && selected[name].size === tickers.length;
    return `<div class="col">
      <div class="colhead">
        <input type="checkbox" id="selall_${slug(name)}" ${allChecked ? "checked" : ""}
               title="Select all" onchange="toggleAll('${name}', this.checked)" ${tickers.length ? "" : "disabled"}>
        <h2>${name}</h2>
        <span class="count">${tickers.length}</span>
      </div>
      <div class="colactions" id="actions_${slug(name)}" style="display:${selected[name].size ? "flex" : "none"}">
        <button class="rmselbtn" type="button" onclick="removeSelected('${name}')">Remove selected</button>
      </div>
      ${rowsHtml}
    </div>`;
  }).join("");
}

async function load() {
  try {
    const res = await fetch("/api/tickers");
    const data = await res.json();
    byTicker = Object.fromEntries((data.tickers || []).map(r => [r.ticker, r]));
  } catch {
    byTicker = {};
  }
  render();
}
load();
</script>
</body>
</html>
