<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trades</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a2333; --muted: #67718a;
    --line: #e3e7ee; --green: #157f3d; --green-bg: #e5f4ea; --red: #b3261e;
    --red-bg: #fbeae9; --accent: #2554c7; --accent-bg: #e8eefb; --gold-bg: #fdf3d8; --gold: #8a6d1a;
    --blue: #0d6efd; --blue-bg: #e3f0ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141c; --panel: #171d29; --text: #e6eaf2; --muted: #8b94a8;
      --line: #262e3f; --green: #4ecb7d; --green-bg: #12301e; --red: #f2726b;
      --red-bg: #391513; --accent: #0b3191; --accent-bg: #1a2540; --gold-bg: #33290f; --gold: #e8c96a;
      --blue: #4d9dff; --blue-bg: #0f2c52;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 10px 24px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 19px; margin: 0; }
  a.back { color: var(--accent); text-decoration: none; font-size: 13px; }
  a.back:hover { text-decoration: underline; }
  h2 { font-size: 14px; margin: 20px 0 10px; }

  .summarygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                 gap: 10px; margin-bottom: 18px; }
  .statbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .statbox .lbl { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
  .statbox .val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .val.pos { color: var(--green); } .val.neg { color: var(--red); }

  .filterbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filterbar select, .filterbar input[type=date] { background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; }
  .filterbar label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }

  .smallbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
              padding: 4px 10px; font-size: 11.5px; cursor: pointer; }
  .smallbtn:hover { color: var(--accent); border-color: var(--accent); }
  .smallbtn.danger:hover { color: var(--red); border-color: var(--red); }
  .tradechart { width: 100%; height: 90px; margin-top: 8px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }

  .pnlchart { width: 100%; height: 220px; background: var(--panel); border: 1px solid var(--line);
              border-radius: 12px; padding: 10px; margin-bottom: 18px; }
  .pnlchart .axislabel { font-size: 10px; fill: var(--muted); }
  .pnllegend { display: flex; gap: 16px; font-size: 11.5px; color: var(--muted); margin: -12px 0 14px 4px; }
  .pnllegend span { display: flex; align-items: center; gap: 5px; }
  .pnllegend .swatch { width: 12px; height: 2px; display: inline-block; }

  table.postable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.postable th, table.postable td {
    text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.postable th { color: var(--muted); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.03em; }
  table.postable td.actionscell { white-space: nowrap; text-align: right; }
  a.tklink { color: inherit; text-decoration: none; font-weight: 700; border-bottom: 1px dashed var(--muted); }
  a.tklink:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .strattag { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .statustag { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 5px;
               padding: 2px 6px; text-transform: uppercase; }
  .statustag.open { background: var(--green-bg); color: var(--green); }
  .statustag.closed { background: var(--line); color: var(--muted); }
  .sparkcell { width: 140px; }
  .sparkcell svg { width: 130px; height: 32px; display: block; }

  .exitform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .exitform input[type=number] { width: 100px; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; padding: 5px 8px; }
  .exitform select { background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trades</h1>
    <a class="back" href="index.html">&larr; Back to dashboard</a>
  </header>

  <div class="summarygrid" id="summaryGrid"></div>

  <h2>Daily P&amp;L</h2>
  <svg id="pnlChart" class="pnlchart" viewBox="0 0 860 220"></svg>
  <div class="pnllegend">
    <span><span class="swatch" style="background:var(--accent)"></span> Unrealized</span>
    <span><span class="swatch" style="background:var(--gold)"></span> Realized (cumulative)</span>
  </div>

  <div class="filterbar">
    <label>Status</label>
    <select id="filterStatus" onchange="onFilterChange()">
      <option value="">All</option>
      <option value="open" selected>Open</option>
      <option value="closed">Closed</option>
    </select>
    <label>Ticker</label>
    <select id="filterTicker" onchange="onFilterChange()"><option value="">All</option></select>
  </div>

  <h2>Positions</h2>
  <div id="positionsTable"><p class="empty">Loading&hellip;</p></div>
</div>
<script>
// Positions are grouped by ticker only, not ticker+strategy -- a position can hold fills from
// multiple strategies, so there's no strategy filter here (see
// docs/superpowers/specs/2026-07-31-position-fills-design.md's grouping decision). Each
// individual fill still records which strategy signaled it (shown on the position detail page).
let allPositions = [];
let marksByPosition = {};

function fmtMoney(v) { return (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2); }
function fmtPct(v) { return (v >= 0 ? "+" : "") + v.toFixed(1) + "%"; }
function plClass(v) { return v >= 0 ? "pos" : "neg"; }

function renderSummary(summary) {
  const grid = document.getElementById("summaryGrid");
  grid.innerHTML = [
    ["Open", summary.open_count ?? 0],
    ["Closed", summary.closed_count ?? 0],
    ["Win rate", summary.win_rate_pct != null ? summary.win_rate_pct + "%" : "&mdash;"],
    ["Avg return", summary.avg_return_pct != null
      ? `<span class="${plClass(summary.avg_return_pct)}">${fmtPct(summary.avg_return_pct)}</span>` : "&mdash;"],
  ].map(([lbl, val]) => `<div class="statbox"><span class="lbl">${lbl}</span><span class="val">${val}</span></div>`).join("");
}

function sparklinePath(marks, valueKey, w, h, pad) {
  if (!marks.length) return { path: "", lo: 0, hi: 0 };
  const values = marks.map(m => m[valueKey]);
  const lo = Math.min(...values), hi = Math.max(...values);
  const span = (hi - lo) || 1;
  const iw = w - pad * 2, ih = h - pad * 2;
  const pts = marks.map((m, i) => {
    const x = pad + (i / Math.max(marks.length - 1, 1)) * iw;
    const y = pad + (1 - (m[valueKey] - lo) / span) * ih;
    return [x, y];
  });
  const path = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  return { path, lo, hi };
}

// Positions price against the option's own modeled value (option_value, from Black-Scholes,
// blended across whichever entry fills are still open) and cost basis, not the underlying
// stock -- a stock moving 2% can easily be a 20%+ swing in an option's value, so tracking
// stock price alone would misrepresent an option position's actual P&L.
function positionRowHtml(p, marks) {
  const isOption = p.instrument === "option";
  const isOpen = p.status === "open";
  const hasOptionValues = isOption && marks.length && marks[0].option_value != null;
  const valueKey = hasOptionValues ? "option_value" : "close_price";
  const { path } = sparklinePath(marks, valueKey, 130, 32, 3);
  const last = marks.length ? marks[marks.length - 1][valueKey] : p.avg_cost;
  const pct = p.avg_cost ? ((last - p.avg_cost) / p.avg_cost * 100) : 0;
  const instrumentLabel = isOption ? "Option" : "Spot";
  const actionsHtml = isOpen ? `
      <button type="button" class="smallbtn" onclick="toggleExitForm(${p.id})">Exit</button>
      <button type="button" class="smallbtn danger" onclick="cancelPosition(${p.id})">Cancel</button>`
    : "";
  return `<tr>
    <td><a class="tklink" href="position.html?id=${p.id}">${p.ticker}</a></td>
    <td><span class="statustag ${p.status}">${p.status}</span></td>
    <td>${instrumentLabel}</td>
    <td>${p.units_remaining}</td>
    <td>${p.avg_cost != null ? fmtMoney(p.avg_cost) : "&mdash;"}</td>
    <td>${fmtMoney(p.tp_price)}</td>
    <td>${fmtMoney(p.stop_price)}</td>
    <td><b class="${plClass(pct)}">${fmtMoney(last)}<br>${fmtPct(pct)}</b></td>
    <td><b class="${plClass(p.realized_pnl)}">${fmtMoney(p.realized_pnl)}</b></td>
    <td class="sparkcell"><svg viewBox="0 0 130 32"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.4"/></svg></td>
    <td class="actionscell">${actionsHtml}</td>
  </tr>
  ${isOpen ? `<tr id="exitrow_${p.id}" style="display:none">
    <td colspan="11">
      <div class="exitform">
        <input type="number" id="exitPrice_${p.id}" step="0.01" placeholder="Exit price">
        <input type="number" id="exitUnits_${p.id}" step="1" placeholder="Units" value="${p.units_remaining}">
        <select id="exitReason_${p.id}">
          <option value="tp">TP</option>
          <option value="stop">Stop</option>
          <option value="manual">Manual</option>
        </select>
        <button type="button" class="smallbtn danger" onclick="submitExit(${p.id})">Confirm exit</button>
      </div>
    </td>
  </tr>` : ""}`;
}

function toggleExitForm(id) {
  const el = document.getElementById(`exitrow_${id}`);
  el.style.display = el.style.display === "none" ? "" : "none";
}

async function submitExit(id) {
  const price = parseFloat(document.getElementById(`exitPrice_${id}`).value);
  const units = parseFloat(document.getElementById(`exitUnits_${id}`).value);
  const exit_reason = document.getElementById(`exitReason_${id}`).value;
  if (!Number.isFinite(price)) { alert("Enter a valid exit price"); return; }
  if (!Number.isFinite(units) || units <= 0) { alert("Enter valid units to exit"); return; }
  const position = allPositions.find(p => p.id === id);
  const lastFill = (await (await fetch(`/api/positions/${id}/fills`)).json()).slice(-1)[0];
  try {
    const res = await fetch(`/api/positions/${id}/fills`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        kind: "exit", instrument: position.instrument,
        strategy_key: lastFill.strategy_key, signal_date: lastFill.signal_date,
        fill_date: todayIsoDate(), price, units, exit_reason,
      }),
    });
    if (!res.ok) { alert("Failed: " + ((await res.json()).detail || res.status)); return; }
    await loadAll();
  } catch (e) {
    alert("Failed: " + e);
  }
}

function todayIsoDate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Cancel = hard delete of the whole position (all fills), distinct from Exit (a real exit
// fill). Not reversible, so confirm before sending the DELETE.
async function cancelPosition(id) {
  if (!confirm("Cancel this position? This permanently deletes it and all its fills, and cannot be undone.")) return;
  try {
    const res = await fetch(`/api/positions/${id}`, { method: "DELETE" });
    if (!res.ok) { alert("Failed: " + ((await res.json()).detail || res.status)); return; }
    await loadAll();
  } catch (e) {
    alert("Failed: " + e);
  }
}

function currentFilters() {
  return {
    status: document.getElementById("filterStatus").value,
    ticker: document.getElementById("filterTicker").value,
  };
}

function filteredPositions() {
  const f = currentFilters();
  return allPositions.filter(p =>
    (!f.status || p.status === f.status) &&
    (!f.ticker || p.ticker === f.ticker)
  );
}

function renderPositionsTable() {
  const el = document.getElementById("positionsTable");
  const positions = filteredPositions();
  if (!positions.length) { el.innerHTML = '<p class="empty">No positions match this filter.</p>'; return; }
  const rows = positions.map(p => positionRowHtml(p, marksByPosition[p.id] || [])).join("");
  el.innerHTML = `<table class="postable">
    <thead><tr>
      <th>Ticker</th><th>Status</th><th>Instrument</th><th>Units</th><th>Avg Cost</th><th>TP</th><th>Stop</th>
      <th>Last / Unrealized %</th><th>Realized $</th><th>Chart</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// $ P&L per position at a given mark: (value - avg_cost) * units_remaining_as_of_that_day *
// multiplier (100 for options, 1 for spot). Positions missing avg_cost (fully flat) contribute
// nothing.
function positionDollarUnrealized(p, valueAtMark, unitsRemaining) {
  if (p.avg_cost == null || !unitsRemaining) return 0;
  const multiplier = p.instrument === "option" ? 100 : 1;
  return (valueAtMark - p.avg_cost) * unitsRemaining * multiplier;
}

// Realized: running total of each position's final realized_pnl, step-changing on the date a
// position actually closed. Unrealized: sum of mark-to-market P&L (value vs. avg cost AS OF
// that day, using replay-derived units_remaining/avg_cost per day, not the current snapshot)
// across whatever was open that day -- recomputed fresh each day, not cumulative.
async function computePnlSeries(positions) {
  const dateSet = new Set();
  for (const p of positions) for (const m of (marksByPosition[p.id] || [])) dateSet.add(m.mark_date);
  for (const p of positions) if (p.status === "closed" && p.closed_at) dateSet.add(p.closed_at.slice(0, 10));
  const dates = [...dateSet].sort();
  if (!dates.length) return { dates: [], realized: [], unrealized: [] };

  // Daily as-of-date replay needs each position's fills -- fetch once per position (positions
  // list is typically small; this mirrors what the position detail page already does per-page).
  const fillsByPosition = {};
  await Promise.all(positions.map(async p => {
    try {
      fillsByPosition[p.id] = await (await fetch(`/api/positions/${p.id}/fills`)).json();
    } catch {
      fillsByPosition[p.id] = [];
    }
  }));

  function replayAsOf(fills, asOfDate) {
    const ordered = fills.filter(f => f.fill_date <= asOfDate).sort((a, b) => a.fill_date === b.fill_date ? a.id - b.id : (a.fill_date < b.fill_date ? -1 : 1));
    let units = 0, cost = 0, realized = 0;
    const multiplier = ordered.length && ordered[0].instrument === "option" ? 100 : 1;
    for (const f of ordered) {
      const value = f.instrument === "option" ? f.premium : f.price;
      if (f.kind === "entry") {
        cost += value * f.units * multiplier;
        units += f.units;
      } else if (f.kind === "exit" && units > 0) {
        const avgCost = cost / units;
        realized += (value - avgCost) * f.units * multiplier;
        cost -= avgCost * f.units * multiplier;
        units -= f.units;
      }
    }
    return { units, avgCost: units > 0 ? cost / units : null, realized, multiplier };
  }

  let runningRealized = 0;
  const realized = [];
  const unrealized = [];
  const closedDates = new Set(positions.filter(p => p.status === "closed" && p.closed_at).map(p => p.closed_at.slice(0, 10)));
  for (const date of dates) {
    if (closedDates.has(date)) {
      for (const p of positions) {
        if (p.status === "closed" && p.closed_at && p.closed_at.slice(0, 10) === date) runningRealized += p.realized_pnl;
      }
    }
    realized.push(runningRealized);

    let dayUnrealized = 0;
    for (const p of positions) {
      const marks = marksByPosition[p.id] || [];
      const mark = marks.find(m => m.mark_date === date);
      if (!mark) continue;
      const state = replayAsOf(fillsByPosition[p.id] || [], date);
      if (state.units <= 0 || state.avgCost == null) continue;
      const valueKey = mark.option_value != null ? "option_value" : "close_price";
      dayUnrealized += (mark[valueKey] - state.avgCost) * state.units * state.multiplier;
    }
    unrealized.push(dayUnrealized);
  }
  return { dates, realized, unrealized };
}

async function renderPnlChart() {
  const svg = document.getElementById("pnlChart");
  // Always all positions, regardless of the table's filter bar -- the chart is a fixed
  // portfolio-wide view, not scoped to whatever the user happens to be looking at below it.
  const { dates, realized, unrealized } = await computePnlSeries(allPositions);
  if (!dates.length) { svg.innerHTML = `<text x="14" y="20" fill="var(--muted)" font-size="12">No P&amp;L data yet.</text>`; return; }

  const w = 860, h = 220, pad = { l: 54, r: 14, t: 14, b: 24 };
  const allVals = [...realized, ...unrealized, 0];
  const yMin = Math.min(...allVals), yMax = Math.max(...allVals);
  const yPad = (yMax - yMin) * 0.1 || 10;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const xOf = i => pad.l + (i / Math.max(dates.length - 1, 1)) * iw;
  const yOf = v => pad.t + (1 - (v - yLo) / (yHi - yLo)) * ih;
  const pathOf = vals => vals.map((v, i) => `${i ? "L" : "M"}${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(" ");

  const yTicks = [];
  for (let i = 0; i <= 4; i++) yTicks.push(yLo + (yHi - yLo) * i / 4);
  const gridHtml = yTicks.map(v => `
    <line x1="${pad.l}" x2="${w - pad.r}" y1="${yOf(v).toFixed(1)}" y2="${yOf(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    <text class="axislabel" x="${pad.l - 6}" y="${(yOf(v) + 3).toFixed(1)}" text-anchor="end">${fmtMoney(v)}</text>`).join("");
  const xTickEvery = Math.max(Math.ceil(dates.length / 7), 1);
  const xTicksHtml = dates.map((d, i) => i % xTickEvery === 0
    ? `<text class="axislabel" x="${xOf(i).toFixed(1)}" y="${h - 6}" text-anchor="middle">${d.slice(5)}</text>` : "").join("");
  const zeroY = yOf(0);

  svg.innerHTML = `
    ${gridHtml}
    ${xTicksHtml}
    <line x1="${pad.l}" x2="${w - pad.r}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" stroke="var(--muted)" stroke-width="1" opacity="0.5"/>
    <path d="${pathOf(unrealized)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <path d="${pathOf(realized)}" fill="none" stroke="var(--gold)" stroke-width="2"/>`;
}

function populateFilters() {
  const tickerSel = document.getElementById("filterTicker");
  const current = tickerSel.value;
  const tickers = [...new Set(allPositions.map(p => p.ticker))].sort();
  tickerSel.innerHTML = '<option value="">All</option>' + tickers.map(tk => `<option value="${tk}">${tk}</option>`).join("");
  if (tickers.includes(current)) tickerSel.value = current;
}

function onFilterChange() {
  renderPositionsTable();
}

async function loadAll() {
  let summary = {};
  try {
    [allPositions, summary] = await Promise.all([
      fetch("/api/positions").then(r => r.json()),
      fetch("/api/positions/summary").then(r => r.json()),
    ]);
  } catch {
    allPositions = []; summary = {};
  }
  marksByPosition = {};
  await Promise.all(allPositions.map(async p => {
    try {
      marksByPosition[p.id] = await (await fetch(`/api/positions/${p.id}/marks`)).json();
    } catch {
      marksByPosition[p.id] = [];
    }
  }));
  renderSummary(summary);
  populateFilters();
  renderPositionsTable();
  await renderPnlChart();
}
loadAll();
</script>
</body>
</html>
