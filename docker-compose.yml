services:
  app:
    build: .
    restart: always
    ports:
      - "3006:3006"
    env_file:
      - .env
    volumes:
      # app_data.db (+ its WAL sidecar files) is the single SQLite database
      # backing everything -- price bars, computed strategy results,
      # candidate tickers, and earnings dates (see backend/db.py) --
      # persisted here so a rebuild doesn't force a full re-screen/re-fetch/
      # recompute of ~2000 tickers against Yahoo (and several minutes of
      # pure CPU work) on every deploy.
      - ./backend/app_data.db:/app/backend/app_data.db
      - ./backend/app_data.db-wal:/app/backend/app_data.db-wal
      - ./backend/app_data.db-shm:/app/backend/app_data.db-shm
      # Uploaded philosophy document(s) for the daily review chatbot (see
      # docs/superpowers/specs/2026-08-04-daily-trade-review-chatbot-design.md)
      # -- kept outside the image so an upload survives a rebuild/redeploy,
      # same reasoning as app_data.db above.
      - ./backend/user_docs:/app/backend/user_docs
