services:
  app:
    build: .
    restart: always
    ports:
      - "3006:3006"
    env_file:
      - .env
    volumes:
      # tickers.py and the screen cache are gitignored/generated at runtime --
      # persist them on the host so a rebuild doesn't force a full re-screen
      # of ~2000 tickers against Yahoo on every deploy.
      - ./webapp/tickers.py:/app/webapp/tickers.py
      - ./webapp/universe_screen_cache.json:/app/webapp/universe_screen_cache.json
